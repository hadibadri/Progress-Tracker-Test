<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE7">
<title>Pomegranate App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Pomegranate v17: two worlds.
   LIGHT (Vessel-like editorial): Today, Progress, Care, messages. Warm ivory, sage and mist panels, the client's single-line figure
   drawn on with a thin trend line crossing it, a frosted vertical capsule, a wavy edge into the page. Geist light for display,
   Newsreader for the small human sentences, Geist Mono for corner-pinned micro labels.
   DARK (Veri-like aura stages): every input and emotional moment. #141315 with colour bleeding in from the edges:
   jade = progress, lavender/mauve = calm and support, dusty rose to plum = dose and treatment.
   One chartreuse needle (#E7FE55) marks "where you are now" and nothing else.
   The clinical alert is the only flat, hard-edged, glow-free surface. Motion: transform and opacity only. */
:root{
  color-scheme:light;
  --ivory:#F4EEE6; --ivory-2:#ECE4DA; --paper:#FFFCF7;
  --ink:#1C1A1B; --ink-2:#3D383A; --mute:#625A5E;
  --sage:#B9CCBD; --sage-l:#D3E0D5; --mist:#E4D7E1; --mist-l:#ECE3EA; --rose-l:#F0DEDA;
  --jade:#A6CFB8; --lav:#D0A8C9; --rose:#D9A3A0; --plum:#5B2E4E; --mauve:#9C7FA6;
  --needle:#E7FE55; --night:#141315;
  --alarm:#7A1527; --alarm-ink:#FFF6F2;
  --sans:'Geist',ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --serif:'Newsreader','Iowan Old Style','Source Serif Pro',Georgia,serif;
  --spring:cubic-bezier(.2,1.3,.3,1); --spring-soft:cubic-bezier(.2,1.1,.3,1); --spring-snap:cubic-bezier(.2,1,.3,1);
  --out:cubic-bezier(.16,1,.3,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ivory)}
body{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;overflow:hidden;font-feature-settings:"ss01"}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3,p,ol{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:14px}
.stage :focus-visible,.dark :focus-visible,#lock :focus-visible,.alarm :focus-visible{outline-color:var(--needle)}
[tabindex="-1"]:focus{outline:none}
.n{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.c{text-align:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}

/* ---------- Type ---------- */
.d-hero{font:300 34px/1.02 var(--sans);letter-spacing:-.04em}
.d-xl{font:300 clamp(32px,10vw,40px)/1.02 var(--sans);letter-spacing:-.045em}
.d-l{font:300 30px/1.06 var(--sans);letter-spacing:-.035em}
.d-m{font:300 26px/1.1 var(--sans);letter-spacing:-.03em}
.h3{font:500 16px/1.3 var(--sans);letter-spacing:-.01em}
.serif{font-family:var(--serif);font-size:17px;line-height:1.38;font-weight:400;letter-spacing:-.005em}
.serif.s{font-size:15.5px;line-height:1.4}
.serif em,em{font-style:italic}
.micro{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:500 11px/1.25 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.micro.c{justify-content:center}
.fine{font-size:13.5px;color:var(--mute)}
.tk{font:500 10.5px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.d-l+.serif,.d-m+.serif,h2+.serif{margin-top:10px}
.light .micro,.page:not(.stage) .micro{color:var(--mute)}

/* ---------- Device stage: full-bleed on phones, a framed device plus reviewer panel on desktop ---------- */
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;position:relative;overflow:hidden;overflow:clip;background:#E9E2D8}
#stage::before{content:"";position:absolute;inset:-20%;background:radial-gradient(34% 30% at 24% 30%,rgba(185,204,189,.75),transparent 70%),radial-gradient(32% 28% at 78% 72%,rgba(208,168,201,.5),transparent 70%),radial-gradient(28% 24% at 72% 18%,rgba(217,163,160,.4),transparent 70%);pointer-events:none}
#device{position:relative;width:100%;height:100%;z-index:1}
#app{position:absolute;inset:0;overflow:hidden;overflow:clip;background:var(--ivory);isolation:isolate}
#review{display:none;position:relative;z-index:1;width:300px;max-height:calc(100% - 64px);overflow:auto;color:var(--ink);scrollbar-width:none}
#sbar{display:none}
@media (min-width:880px) and (min-height:640px){
  #device{width:393px;height:min(852px,calc(100% - 56px));border-radius:54px;box-shadow:0 0 0 11px #1D1A1C,0 0 0 12px #3A3437,0 50px 90px -40px rgba(28,26,27,.55);transform:translateZ(0)}
  #app{border-radius:54px;--sat:44px;--sab:18px}
  #review{display:block}
  #sbar{display:flex;position:absolute;top:0;left:0;right:0;height:44px;z-index:100;align-items:center;justify-content:space-between;padding:0 30px 0 36px;font:600 15px var(--sans);pointer-events:none;color:var(--ink)}
  #sbar.light{color:#fff}
}
#sbar i{display:inline-flex;gap:5px;align-items:center}
#sbar svg{height:12px;width:auto}
#review .rv-k{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#review h2{font:300 28px var(--sans);letter-spacing:-.03em;margin:6px 0}
#review p{font:400 15px/1.4 var(--serif);color:var(--ink-2);margin-bottom:14px}
#review .rv-list{display:grid;gap:2px}
#review .rv-list button{display:flex;gap:12px;align-items:baseline;width:100%;padding:9px 12px;border-radius:14px;font:500 14px var(--sans);min-height:40px}
#review .rv-list button small{font:400 12.5px var(--sans);color:var(--mute)}
#review .rv-list button:hover{background:rgba(255,252,247,.6)}
#review .rv-list button[aria-current="true"]{background:var(--ink);color:var(--paper)}
#review .rv-list button[aria-current="true"] small,#review .rv-list button[aria-current="true"] b{color:rgba(255,252,247,.7)}
#review .rv-list b{font:400 11.5px var(--mono);color:var(--mute);min-width:20px}
#review .rv-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
#review .rv-act button{font:500 13px var(--sans);padding:8px 14px;border-radius:999px;background:var(--paper);min-height:36px}

/* ---------- Views ---------- */
#view{position:absolute;inset:0;background:var(--ivory);transition:transform .6s var(--out),opacity .4s ease;overflow:hidden;overflow:clip;z-index:1}
#app.paged:not(.sheeted) #view{transform:translate3d(-14%,0,0)}
#app.sheeted #view{transform:scale(.94);transform-origin:50% 0}
#app.darkview #view{background:var(--night)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen.light{background:var(--ivory);padding-bottom:calc(104px + var(--sab))}
.screen.dark{background:var(--night);color:#F4F1EE}
.screen.tabin{animation:tabIn .5s var(--out)}
@keyframes tabIn{from{opacity:0;transform:translate3d(0,10px,0)}}

/* header: wordmark + profile square */
.hdr{position:relative;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 10px) 18px 0 20px}
.wm{width:128px;color:var(--ink);min-height:44px;display:flex;align-items:center}
.wm svg{width:100%;height:auto;display:block}
.wm.light{color:#fff}
.avatar{width:44px;height:44px;border-radius:15px;background:rgba(255,252,247,.5);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 6px 16px -10px rgba(28,26,27,.4);display:grid;place-items:center;font:500 15px var(--sans);transition:transform .45s var(--spring)}
.avatar.dark{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);color:#fff}
.avatar:active{transform:scale(.92)}

/* ---------- Hero panels ---------- */
.hero{position:relative;overflow:hidden;view-transition-name:hero}
.hero.sage{background:var(--sage)}
.hero.mist{background:var(--mist)}
.hero .wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:44px;fill:var(--ivory);z-index:8;pointer-events:none}
.h-copy{position:relative;z-index:9;padding:18px 20px 0}
.h-copy .micro{color:var(--ink-2)}
.h-copy h1{margin-top:12px}
.lede{margin-top:10px;color:var(--ink-2)}
.t-hero .h-copy{max-width:clamp(184px,55vw,224px)}
.t-hero .d-hero{font-size:clamp(27px,8vw,31.5px);white-space:nowrap}
.hl-back{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible;pointer-events:none}
.hl-pace{fill:none;stroke:var(--ink);stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:1.5 5;stroke-linecap:round}
.hl-front{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;view-transition-name:trend}
.hl-front>div{position:absolute;inset:0}
.hl-front svg{width:100%;height:100%;display:block;overflow:visible}
.hl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.hl-flat{fill:none;stroke:var(--ink);stroke-opacity:.5;stroke-width:1.4;stroke-dasharray:2 6;stroke-linecap:round}
.hl-front circle{fill:var(--ink)}
.now-dot{position:absolute;z-index:6;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--needle);box-shadow:0 0 0 2px var(--ink);pointer-events:none}
.screen.first .now-dot{animation:capIn .8s var(--spring) 1.55s both}
/* line-art figure */
.la{display:block;overflow:hidden;color:#2E1B2A;width:100%;height:100%}
.la-bust,.la-face{-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 98%);mask-image:linear-gradient(180deg,#000 62%,transparent 98%)}
.la.ivory{color:#F4EEE6}
.la.mirror{transform:scaleX(-1)}
.la-ink{fill:currentColor}
.la-halo{fill:none;stroke:var(--sage);stroke-width:22;stroke-linejoin:round}
.la .lm{fill:none;stroke:#fff;stroke-width:46;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:0}
.la .lm-all{fill:#fff}
.la.draw .lm{animation:laDraw var(--t) cubic-bezier(.42,.02,.18,1) var(--o) both}
.la.draw .lm-all{animation:laAll .6s ease var(--end) both}
@keyframes laDraw{from{stroke-dashoffset:1}}
@keyframes laAll{from{opacity:0}}
.la-wrap{position:absolute;z-index:4;pointer-events:none}
.la-glow{position:absolute;z-index:2;border-radius:50%;background:radial-gradient(closest-side,rgba(255,252,247,.7),rgba(255,252,247,.3) 55%,rgba(255,252,247,0));animation:glowBreath 8s ease-in-out infinite alternate;will-change:transform;pointer-events:none}
@keyframes glowBreath{from{transform:translate3d(0,0,0) scale(1);opacity:.85}to{transform:translate3d(-3%,2%,0) scale(1.07);opacity:1}}
.screen.first .la-glow{animation:glowIn 1.6s var(--out) both,glowBreath 8s ease-in-out 1.6s infinite alternate}
@keyframes glowIn{from{opacity:0;transform:scale(.9)}}
.ob-fig{flex:1 1 0;min-height:90px;max-height:300px;display:flex;justify-content:center;margin:14px 0 10px}
.ob-fig .la{width:auto;height:100%}
.ob0 .ob-mid{flex:none}
.ret-head{position:relative}
.ret-fig{position:absolute;right:-8px;top:-6px;width:84px;height:162px;pointer-events:none}
.ret-head h1{max-width:calc(100% - 74px)}
.ret-head .serif{max-width:calc(100% - 60px)}
.mile-fig{flex:none;height:clamp(64px,12vh,124px);display:flex;justify-content:center;margin-bottom:6px}
.mile-fig .la{width:auto}
.capsule-h{position:absolute;z-index:5;width:74px;border-radius:37px;background:rgba(255,252,247,.42);-webkit-backdrop-filter:blur(3px) saturate(1.2);backdrop-filter:blur(3px) saturate(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 14px 30px -16px rgba(28,26,27,.35);display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:1px;transition:transform .5s var(--spring)}
.capsule-h b{font:400 20px/1.1 var(--sans);letter-spacing:-.035em}
.capsule-h small{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.capsule-h:active{transform:scale(.96)}
.cap-ring{position:absolute;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--needle);box-shadow:0 0 0 2px var(--ink),0 0 0 5px rgba(255,252,247,.6)}
.hl-labels{position:absolute;left:0;right:0;z-index:9;height:40px;pointer-events:none}
.hlab{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1}
.hlab i{font:italic 400 12.5px var(--serif);color:var(--ink-2)}
.hlab b{font:400 17px var(--sans);letter-spacing:-.02em;margin-top:3px}
.hlab i,.hlab b{text-shadow:0 0 4px var(--sage),0 0 8px var(--sage),0 0 12px var(--sage)}

/* ---------- Light body ---------- */
.body{padding:2px 20px 0;display:flex;flex-direction:column;gap:14px;position:relative}
.nx{padding:4px 0 6px}
.nx h2{margin-top:10px}
.nx .serif{color:var(--ink-2);margin-top:8px}
.dose-amt{display:flex;align-items:flex-end;gap:8px;margin:12px 0 4px}
.dose-amt .big{font:300 66px/.86 var(--sans);letter-spacing:-.06em}
.dose-amt .u{font:400 15px var(--sans);padding-bottom:4px}
.dose-amt .meta{margin:0 0 0 auto;text-align:right;font-size:14.5px;line-height:1.35;color:var(--ink-2)}
.donehead{display:flex;align-items:center;gap:12px;margin-top:10px}
.donehead h2{margin:0}
.seal{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--needle);display:grid;place-items:center;flex:none}
.seal svg{width:20px;height:20px}
.justdone .seal{animation:sealIn .9s var(--spring) both}
@keyframes sealIn{0%{transform:scale(.3);opacity:0}60%{opacity:1}100%{transform:none}}
.links{display:flex;gap:22px;flex-wrap:wrap;margin-top:4px}
.link{position:relative;min-height:44px;display:inline-flex;align-items:center;gap:6px;font:500 15px var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;text-decoration-color:rgba(28,26,27,.35)}
.link svg{width:16px;height:16px}
.link .chev{width:15px;height:15px;color:inherit}

/* the pill + orb call to action (Veri's "Start tracking +"), one per screen */
.pill-cta{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:6px 6px 6px 24px;margin-top:16px;border-radius:999px;background:var(--ink);color:var(--paper);font:500 16px var(--sans);letter-spacing:-.01em;text-align:left;transition:transform .5s var(--spring)}
.pill-cta::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 16px 30px -18px rgba(28,26,27,.65);z-index:-1;transition:opacity .25s}
.pill-cta .orb{width:48px;height:48px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .6s var(--spring)}
.pill-cta .orb svg{width:20px;height:20px}
.pill-cta:active{transform:scale(.975) translateY(1px)}
.pill-cta:active::after{opacity:0}
.pill-cta:active .orb{transform:translateX(-3px) scale(.9)}
.pill-cta[aria-disabled="true"]{background:rgba(28,26,27,.09);color:var(--ink-2)}
.pill-cta[aria-disabled="true"]::after{opacity:0}
.pill-cta[aria-disabled="true"] .orb{background:rgba(28,26,27,.1);color:var(--ink-2)}
.pill-cta.on-dark{background:rgba(20,19,21,.8);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);}
.pill-cta.on-dark .orb{background:#fff;color:var(--night)}
.pill-cta.on-dark::after{box-shadow:0 18px 34px -18px rgba(0,0,0,.7)}
.pill-cta.on-dark[aria-disabled="true"]{background:rgba(20,19,21,.8);color:rgba(255,255,255,.74)}
.pill-cta.on-dark[aria-disabled="true"] .orb{background:rgba(255,255,255,.2);color:rgba(255,255,255,.8)}
.pill-cta.on-dark.set .orb{background:var(--jade)}
.pill-cta.danger{background:var(--alarm)}
.pill-cta input[type=file],.link input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.attn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 14px 16px;border-radius:24px;background:var(--paper);box-shadow:0 1px 0 rgba(28,26,27,.04),0 14px 30px -22px rgba(28,26,27,.35);min-height:64px;text-align:left;transition:transform .45s var(--spring)}
.attn:active{transform:scale(.98)}
.attn .k{flex:1;display:flex;flex-direction:column;gap:3px;font:500 15px/1.3 var(--sans);min-width:0}
.attn small{font:400 13.5px/1.35 var(--sans);color:var(--mute)}
.attn .new{width:10px;height:10px;border-radius:50%;background:var(--needle);box-shadow:0 0 0 2px var(--ink);flex:none}
.attn.soft{background:#F3E8DA}
.gi{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(28,26,27,.06);flex:none}
.gi svg{width:20px;height:20px}
.gi.jade{background:var(--sage-l)}
.gi.warn{color:var(--alarm);background:#F4E2E0}
.chev{width:18px;height:18px;color:var(--mute);flex:none}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;overflow:hidden;border-radius:26px;padding:16px 14px 14px;min-height:156px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;transition:transform .45s var(--spring)}
.tile:active{transform:scale(.97)}
.tile b{font:400 18px/1.15 var(--sans);letter-spacing:-.025em;margin-top:6px}
.tile .ts{font-size:14px;line-height:1.3;color:var(--ink-2)}
.tile>svg{margin-top:auto;width:100%;height:26px;color:var(--ink);overflow:visible}
.tile .gi{background:rgba(255,255,255,.55)}
.tile .faces{margin-top:auto}
.t-sage{background:var(--sage-l)}.t-mist{background:var(--mist-l)}.t-rose{background:var(--rose-l)}
.faces{display:flex}
.faces .face+.face{margin-left:-10px}
.face{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:500 14px var(--sans);position:relative;background:#CDB6C8;color:#2B2229;box-shadow:0 0 0 2px var(--paper);flex:none}
.faces.sm .face{width:34px;height:34px;font-size:12px}
.face.shah{background:#B9CCBD}.face.me{background:#E3C6C0;width:52px;height:52px;font-size:17px}
.face .on{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#4F8A66;box-shadow:0 0 0 2px #fff}

/* editorial rows: atmospheric photos, people small in the frame */
.ed{display:grid;grid-template-columns:36% 1fr;gap:14px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:28px;background:var(--paper);transition:transform .45s var(--spring)}
.ed:active{transform:scale(.98)}
.ed.rev{grid-template-columns:1fr 36%}
.ed.rev .ed-ph{order:2}
.ed.rev .ed-in{padding-left:8px}
.ed-ph{display:block;border-radius:20px;overflow:hidden;aspect-ratio:3/4}
.ed-ph img{width:100%;height:100%;object-fit:cover}
.ed-in{display:flex;flex-direction:column;gap:6px;padding:4px 6px 4px 0;min-width:0}
.ed-in b{font:400 19px/1.15 var(--sans);letter-spacing:-.025em}
.ed-in .serif{color:var(--ink-2)}
.ed.tall{grid-template-columns:42% 1fr}
.daydots{display:flex;gap:5px;margin-top:4px}
.daydots i{width:8px;height:8px;border-radius:50%;background:rgba(28,26,27,.14)}
.daydots i.on{background:var(--ink)}
.daydots i.now{background:var(--needle);box-shadow:0 0 0 1.5px var(--ink)}
.caught{text-align:center;padding:14px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.caught .serif{color:var(--ink-2)}

/* tab bar: a dark floating capsule; the active pill morphs between tabs */
#tabs{position:absolute;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);width:min(calc(100% - 32px),344px);height:64px;padding:6px;border-radius:32px;background:rgba(24,22,23,.94);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);display:grid;grid-template-columns:repeat(3,1fr);z-index:20;box-shadow:0 20px 40px -18px rgba(28,26,27,.6),inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .6s var(--spring),opacity .3s;view-transition-name:tabs}
#tabs button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;color:rgba(255,255,255,.74);font:500 14px var(--sans);border-radius:26px;min-height:52px;transition:color .2s}
#tabs button svg{width:20px;height:20px;flex:none}
#tabs button[aria-selected="true"]{color:var(--ink)}
#tabs .ind{position:absolute;top:6px;left:6px;width:calc((100% - 12px)/3);height:52px;border-radius:26px;background:var(--paper);transition:transform .62s var(--spring);view-transition-name:tabind}
#tabs .badge{position:absolute;top:11px;right:calc(50% - 30px);width:9px;height:9px;border-radius:50%;background:var(--needle);box-shadow:0 0 0 2px #1C1A1B}
#app.bare #tabs{transform:translate(-50%,150%);opacity:0;pointer-events:none}
@media (max-width:350px){ #tabs button span{font-size:13px} #tabs button{gap:5px} }

/* ---------- Pages, sheets, stages ---------- */
#scrim{position:absolute;inset:0;z-index:35;background:rgba(20,19,21,.38);opacity:0;pointer-events:none;transition:opacity .45s ease}
#scrim.on{opacity:1;pointer-events:auto}
#pages{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden;overflow:clip}
#pages .page{position:absolute;inset:0;pointer-events:auto;background:var(--ivory);display:flex;flex-direction:column;transform:translate3d(100%,0,0);transition:transform .62s var(--spring-soft);will-change:transform;box-shadow:-30px 0 60px -40px rgba(28,26,27,.4)}
#pages .page.in{transform:none}
#pages .page.out{transform:translate3d(100%,0,0);transition:transform .42s cubic-bezier(.4,0,.2,1)}
#pages .page.drag{transition:none}
#pages .page.sheet{top:auto;max-height:calc(100% - 52px);border-radius:30px 30px 0 0;transform:translate3d(0,105%,0);transition:transform .66s var(--spring-soft);box-shadow:0 -20px 60px -30px rgba(28,26,27,.5)}
#pages .page.sheet.in{transform:none}
#pages .page.sheet.out{transform:translate3d(0,105%,0);transition:transform .4s cubic-bezier(.4,0,.2,1)}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:rgba(28,26,27,.2);margin:8px auto 0;flex:none}
#pages .stage{background:var(--night);color:#F4F1EE;transform:none;opacity:0;transition:opacity .26s cubic-bezier(.2,0,0,1);box-shadow:none}
#pages .stage.in{opacity:1}
#pages .stage.out{transform:none;opacity:0;transition:opacity .38s ease}
#pages .stage.drag{transition:none}
.ph-bar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) 12px 6px;flex:none;min-height:60px}
.sheet .ph-bar{padding-top:6px}
.ph-bar .t{flex:1;min-width:0;text-align:center;font:500 16px/1.25 var(--sans);display:flex;flex-direction:column;letter-spacing:-.01em}
.ph-bar .t small{font:400 12.5px var(--sans);color:var(--mute)}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(28,26,27,.08);flex:none;transition:transform .4s var(--spring)}
.ico:active{transform:scale(.9)}
.ico svg{width:20px;height:20px}
.ico.glass{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);color:#fff}
.sp{width:44px;flex:none}
.pscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:8px 20px 28px;-webkit-overflow-scrolling:touch}
.pscroll.flush{padding:0 0 28px}
.pscroll.more{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 40px),rgba(0,0,0,.08));mask-image:linear-gradient(180deg,#000 calc(100% - 40px),rgba(0,0,0,.08))}
.px{padding:0 20px}
.pfoot{flex:none;padding:10px 20px calc(12px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--ivory);box-shadow:0 -1px 0 rgba(28,26,27,.06)}
.pfoot .pill-cta{margin-top:0}
.photo-band{height:200px;overflow:hidden;position:relative;margin-bottom:18px}
.photo-band img{width:100%;height:100%;object-fit:cover}
.photo-band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(244,238,230,0) 55%,var(--ivory))}

/* stage body */
.sbody{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.st-bar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) 14px 4px;min-height:60px;flex:none}
.st-bar .t{flex:1;text-align:center;font:400 17px var(--sans);letter-spacing:-.01em;color:#fff}
.st-scroll{padding:6px 20px 24px}
.st-scroll.mid{display:flex;flex-direction:column;justify-content:safe center}
.st-scroll.mid>*{flex:none}
.stage .serif{color:rgba(255,255,255,.84)}
.stage .h3{color:#fff}
.stage .fine,.dark .fine,#lock .fine{color:rgba(255,255,255,.8)}
.stage .micro,.dark .micro{color:rgba(255,255,255,.86)}
.st-foot::before,.ob-foot::before{content:"";position:absolute;left:0;right:0;top:-24px;bottom:0;background:linear-gradient(180deg,rgba(20,19,21,0),rgba(20,19,21,.62) 40%,rgba(20,19,21,.78));z-index:-1;pointer-events:none}
.st-foot{flex:none;position:relative;z-index:2;padding:10px 20px calc(16px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:2px}
.st-foot .pill-cta{margin-top:0}
.st-foot.two{flex-direction:row;gap:10px}
.st-foot.two .pill-cta{flex:1}
.st-foot.late{animation:rise .7s var(--spring-soft) both}
.st-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.links-d{display:flex;justify-content:center;flex-wrap:wrap;column-gap:18px;margin-top:6px}
.link-d{position:relative;min-height:44px;display:inline-flex;align-items:center;gap:6px;font:500 15px var(--sans);color:#fff;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;text-decoration-color:rgba(255,255,255,.45)}
.link-d svg{width:16px;height:16px}
.ghost-d{min-height:56px;border-radius:999px;background:rgba(20,19,21,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.32);color:#fff;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 15px var(--sans);transition:transform .45s var(--spring)}
.ghost-d svg{width:18px;height:18px}
.ghost-d:active{transform:scale(.96)}
.gone{opacity:0;transform:translate3d(0,8px,0);transition:opacity .35s ease,transform .5s var(--out);pointer-events:none;visibility:hidden}

/* ---------- Aura ---------- */
.aura{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:var(--night)}
.ret>.aura{position:fixed}
.pal{position:absolute;inset:0;transition:opacity 1s ease;background:
  radial-gradient(64% 40% at 0% 102%,var(--c1),transparent 72%),
  radial-gradient(60% 38% at 100% 96%,var(--c2),transparent 72%),
  radial-gradient(80% 26% at 50% 114%,var(--c3),transparent 70%),
  radial-gradient(44% 20% at 106% -4%,var(--c2),transparent 70%),
  radial-gradient(34% 18% at -6% 4%,var(--c3),transparent 70%)}
.pal i{position:absolute;border-radius:50%;will-change:transform;animation:breathe 9s ease-in-out infinite alternate}
.pal .g1{width:90%;height:46%;left:-45%;bottom:-16%;background:radial-gradient(closest-side,var(--c1),transparent);opacity:.8}
.pal .g2{width:70%;height:36%;right:-46%;top:46%;background:radial-gradient(closest-side,var(--c2),transparent);opacity:.7;animation-delay:-3s}
.pal .g3{width:110%;height:34%;left:-5%;bottom:-22%;background:radial-gradient(closest-side,var(--c3),transparent);opacity:.75;animation-delay:-6s}
@keyframes breathe{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(5%,-4%,0)}}
.core{position:absolute;left:-22%;right:-22%;top:-10%;bottom:6%;background:radial-gradient(closest-side,var(--night) 0%,var(--night) 52%,rgba(20,19,21,.82) 72%,rgba(20,19,21,0) 100%);transform-origin:50% 46%;transition:transform 1.4s var(--spring-soft)}
.aura.bloom .core{animation:bloom 2s var(--out)}
@keyframes bloom{0%{transform:scale(1)}30%{transform:scale(.5);opacity:.55}100%{transform:scale(1);opacity:1}}
.grain{position:absolute;inset:0;background-image:var(--grain);opacity:.55}
.p-jade{--c1:#A6CFB8;--c2:#6F9E87;--c3:#D3E9DB}
.p-bright{--c1:#BFE3C9;--c2:#86BFA0;--c3:#E4F2C4}
.p-calm{--c1:#D0A8C9;--c2:#9C7FA6;--c3:#E8D2E2}
.p-rough{--c1:#8E6A8F;--c2:#6B4F78;--c3:#B79AC0}
.p-dose{--c1:#D9A3A0;--c2:#8A4A6B;--c3:#EBC3BC}
.p-brand{--c1:#D9A3A0;--c2:#A6CFB8;--c3:#D0A8C9}
#pages .stage .aura .core{transform:scale(1.5)}
#pages .stage.in .aura .core{transform:scale(1)}

/* ---------- Glass on dark ---------- */
.glass-card{background:rgba(20,19,21,.52);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);border-radius:26px;padding:16px;}
.glass-list{border-radius:24px;background:rgba(20,19,21,.52);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);overflow:hidden;}
.grow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;text-align:left;color:#fff;position:relative}
.grow+.grow::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:rgba(255,255,255,.1)}
.grow .k{flex:1;display:flex;flex-direction:column;gap:2px;font:400 15.5px var(--sans);min-width:0}
.grow small{font:400 13.5px var(--sans);color:rgba(255,255,255,.76)}
.grow .v{font:400 14.5px var(--sans);color:rgba(255,255,255,.76)}
.grow .v b{color:#fff;font-weight:500}
.grow .gi{background:rgba(255,255,255,.1)}
.grow .chev{color:rgba(255,255,255,.66)}
.gchips{display:flex;flex-wrap:wrap;gap:8px}
.gchip{position:relative;isolation:isolate;min-height:44px;padding:10px 16px;border-radius:999px;background:rgba(20,19,21,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#fff;font:400 14.5px/1.2 var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .45s var(--spring)}
.gchip svg{width:18px;height:18px}
.gchip::before{content:"";position:absolute;inset:0;border-radius:inherit;background:#fff;opacity:0;transform:scale(.82);transition:opacity .22s ease,transform .5s var(--spring);z-index:-1}
.gchip::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 10px 18px -12px rgba(0,0,0,.8);z-index:-2;transition:opacity .2s}
.gchip[aria-pressed="true"]{color:var(--night)}
.gchip[aria-pressed="true"]::before{opacity:1;transform:none}
.gchip:active{transform:translateY(1.5px) scale(.95)}
.gchip:active::after{opacity:0}
.gchip.big{min-height:54px;border-radius:18px;padding:8px 10px}

/* ---------- Onboarding ---------- */
.obwrap{position:absolute;inset:0;color:#F4F1EE;background:var(--night);overflow:hidden}
.obwrap.leaving{animation:leave .45s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(1.04)}}
.obbody{position:relative;z-index:2;height:100%}
.ob{height:100%;display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 14px 0;min-height:60px;flex:none}
.steps{display:flex;gap:6px}
.steps i{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.22);transition:background-color .3s}
.steps i.on{background:#fff}
.ob .pscroll{padding:10px 20px 18px}
.ob-foot{flex:none;position:relative;z-index:1;padding:10px 20px calc(18px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:2px}
.ob-foot .pill-cta{margin-top:0}
.ob-foot .fine{margin-top:8px}
.ob0{justify-content:space-between}
.ob-wm{width:168px;margin:calc(var(--sat) + 28px) auto 0;color:#fff}
.ob-wm svg{width:100%;height:auto;display:block}
.ob-mid{padding:0 26px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ob-mid .serif{text-align:center;max-width:320px}
.ob .d-l{margin-top:10px}
.plan{display:flex;gap:12px;align-items:flex-start;margin-top:18px}
.plan b{font:500 16px var(--sans)}
.plan p{font:400 14px/1.4 var(--sans);color:rgba(255,255,255,.76);margin-top:4px}
.plan .face{box-shadow:none}
.daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dchip{position:relative;isolation:isolate;min-height:58px;border-radius:20px;background:rgba(20,19,21,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .45s var(--spring)}
.dchip b{font:500 14.5px var(--sans)}
.dchip small{font:400 11.5px var(--mono);color:rgba(255,255,255,.7)}
.dchip::before{content:"";position:absolute;inset:0;border-radius:inherit;background:#fff;opacity:0;transform:scale(.8);transition:opacity .22s,transform .55s var(--spring);z-index:-1}
.dchip[aria-pressed="true"]{color:var(--night)}
.dchip[aria-pressed="true"] small{color:#4E474A}
.dchip[aria-pressed="true"]::before{opacity:1;transform:none}
.dchip:active{transform:scale(.94)}
/* what to expect: a vertical, scrubbable timeline */
.tl{position:relative;margin-top:20px;padding-left:40px;touch-action:none;-webkit-user-select:none;user-select:none}
.tl-rail{position:absolute;left:13px;top:14px;bottom:24px;width:2px}
.tl-rail::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.16);border-radius:1px}
.tl-fill{position:absolute;inset:0;background:linear-gradient(#fff,rgba(255,255,255,.5));transform-origin:top;transform:scaleY(0);transition:transform .7s var(--spring-soft)}
.tl-needle{position:absolute;left:-10px;top:-14px;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--night);box-shadow:0 0 0 2px #fff,0 0 18px rgba(231,254,85,.5);transition:transform .7s var(--spring)}
.tl-needle::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--needle)}
.tl.drag .tl-needle,.tl.drag .tl-fill{transition:none}
.tl-i{position:relative;display:block;width:100%;text-align:left;padding:6px 0 14px;min-height:44px;color:#fff;opacity:.66;transition:opacity .35s ease,transform .5s var(--spring)}
.tl-i.on{opacity:1}
.tl-i::before{content:"";position:absolute;left:-31px;top:12px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.36)}
.tl-i.on::before,.tl-i.past::before{background:#fff}
.tl-k{display:block;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tl-t{display:block;font:400 17px/1.36 var(--serif);margin-top:5px}
.notif{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;background:rgba(48,44,47,.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.notif b{display:block;font:500 14px var(--sans)}
.notif span{font:400 14px/1.35 var(--sans);color:rgba(255,255,255,.78)}
.notif time{margin-left:auto;align-self:flex-start;font:400 12px var(--sans);color:rgba(255,255,255,.7)}
.notif.light{background:var(--paper);box-shadow:inset 0 0 0 1px rgba(28,26,27,.06)}
.notif.light span{color:var(--mute)}
.appicon{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,#5A3150,#3A1F33);display:grid;place-items:center;flex:none}
.appicon svg{width:24px;height:24px}
.sw{position:relative;width:50px;height:30px;border-radius:15px;background:rgba(28,26,27,.16);flex:none}
.sw::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--ink);opacity:0;transition:opacity .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .5s var(--spring)}
[aria-checked="true"] .sw::before{opacity:1}
[aria-checked="true"] .sw::after{transform:translateX(20px)}
.grow .sw{background:rgba(255,255,255,.22)}
.grow .sw::before{background:#fff}
.grow[aria-checked="true"] .sw::after{background:var(--night)}

@media (max-height:700px){
  .ob .d-l,.stage .d-l{font-size:26px}
  .tl{margin-top:14px}
  .tl-i{padding:4px 0 10px}
  .tl-t{font-size:15.5px;line-height:1.3;margin-top:3px}
  .ob-foot{padding-top:6px;padding-bottom:calc(12px + var(--sab))}
  .ob-top{min-height:52px}
  .hold{--rs:min(220px,58vw,27vh);margin-top:10px}
  .dose-amt .big{font-size:54px}
  .dose-amt{margin-top:8px}
  .nx h2{margin-top:6px}
  .trio{margin-top:8px}
  .readout{margin-top:10px}
  .hold+.serif{margin-top:2px}
  .sealed .h3.c,.st-scroll .h3.c.mt16{margin-top:10px}
  .links-d{margin-top:0}
}
@media (max-height:600px){
  .dose-amt .big{font-size:44px}
  .dose-amt{margin:4px 0 0}
  .nx .pill-cta{margin-top:10px;min-height:56px}
  .nx .pill-cta .orb{width:44px;height:44px}
  .body{gap:10px}
  .nx{padding-top:0}
}
/* ---------- Return: the fog lifts ---------- */
.ret{padding-bottom:40px}
.ret-in{position:relative;z-index:2;padding:0 20px 28px;display:flex;flex-direction:column;gap:18px}
.ret-in .hdr{padding-left:0;padding-right:0}
.ret .d-xl{margin-top:10px}
.ret .serif{margin-top:10px}
.record{display:flex;gap:14px;align-items:center}
.record svg{width:84px;height:84px;flex:none}
.record b{font:500 16px var(--sans)}
.record p{font:400 14px/1.4 var(--sans);color:rgba(255,255,255,.78);margin-top:3px}
.nxd .d-m{margin-top:10px}
.nxd .link-d{margin-top:4px}
.nxd{display:flex;flex-direction:column;align-items:flex-start}
.fog{position:absolute;inset:0;overflow:hidden;z-index:4;pointer-events:none;background:radial-gradient(70% 50% at 50% 36%,rgba(240,232,238,.98),rgba(214,198,214,.94) 55%,rgba(150,128,152,.9) 100%);animation:fogLift 1.7s cubic-bezier(.65,0,.35,1) .12s both}
.fog i{position:absolute;width:80%;height:40%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent);animation:drift 2.6s ease-out both}
.fog i:first-child{left:-10%;top:20%}
.fog i:last-child{right:-14%;top:48%;animation-direction:reverse}
@keyframes fogLift{0%{opacity:1;transform:none}100%{opacity:0;transform:translate3d(0,-34%,0);visibility:hidden}}
@keyframes drift{from{transform:translate3d(-8%,0,0)}to{transform:translate3d(10%,-6%,0)}}
.screen.dark.leaving{animation:leave .45s ease forwards}

/* ---------- Instruments ---------- */
.readout{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0 4px;min-height:84px}
.readout.sm{min-height:60px;margin-top:14px}
.readout .u{font:400 17px var(--sans);color:rgba(255,255,255,.76);padding-bottom:2px}
.dm{display:block;position:relative;width:calc(var(--cols) * var(--pitch,10px));max-width:var(--maxw,72vw);color:#fff}
.dm-xl{--pitch:10.4px}
.dm-l{--pitch:8.6px;--maxw:46vw}
.dm-hero{--pitch:19px;--maxw:66vw}
.dm-disc{--pitch:5.4px;--maxw:46%;color:var(--night)}
.dm i{position:absolute;width:calc(100% / var(--cols) * .74);aspect-ratio:1;margin:calc(100% / var(--cols) * .13);border-radius:50%;background:currentColor;opacity:.07;transform:scale(.5);transition:opacity .26s ease var(--dl,0ms),transform .55s var(--spring) var(--dl,0ms)}
.dm i.on{opacity:1;transform:none}
.dm.fast i{transition:none}
.dm i.sc{opacity:0;transform:translate(var(--tx,0),var(--ty,0)) scale(.2);transition:none}
.mile-num .dm i{transition-duration:.7s,1.2s}
.typein{width:min(260px,70vw);background:transparent;border:0;border-bottom:1.5px solid rgba(255,255,255,.5);color:#fff;font:300 56px/1 var(--sans);letter-spacing:-.05em;text-align:center;padding:4px 0;outline:none;caret-color:var(--needle)}
.typein:focus{border-bottom-color:var(--needle)}
.delta{margin-top:6px;min-height:24px}
.warnline{color:#FFD9CF!important;margin-top:12px}
/* tick ruler */
.ruler-wrap{margin:16px -20px 0;position:relative}
.ruler{position:relative;height:96px;touch-action:pan-y;cursor:grab;outline:none;-webkit-user-select:none;user-select:none}
.ruler.drag{cursor:grabbing}
.ruler:focus-visible{box-shadow:inset 0 0 0 2px rgba(231,254,85,.75);border-radius:18px}
.r-track{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.r-strip{position:absolute;left:0;top:18px;height:62px;will-change:transform;background-repeat:repeat-x;background-image:linear-gradient(90deg,rgba(255,255,255,.92) 0 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 0 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.3) 0 1px,transparent 1px)}
.r-strip span{position:absolute;top:44px;transform:translateX(-50%);margin-left:1px;font:400 12px var(--mono);color:rgba(255,255,255,.7)}
.r-needle{position:absolute;left:50%;top:10px;width:2px;height:54px;margin-left:0;background:var(--needle);border-radius:1px;box-shadow:0 0 14px rgba(231,254,85,.55);pointer-events:none;transform-origin:50% 0}
.r-needle::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:8px solid var(--needle);border-bottom:0}
.ruler.tick .r-needle{animation:needle .2s ease}
@keyframes needle{50%{transform:scaleY(1.14)}}
/* press-and-hold ring */
.hold{--rs:min(244px,62vw,32vh);position:relative;width:var(--rs);height:var(--rs);margin:16px auto 0;--ms:1150ms}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring line{stroke-width:2.4;stroke-linecap:round}
.ring .base line{stroke:rgba(255,255,255,.24)}
.ring .lit line{stroke:#fff;opacity:0;transition:opacity .12s ease}
.hold.holding .lit line{opacity:1;transition-delay:calc(var(--i) * var(--ms) / 72)}
.hold.release .lit line{transition:opacity .18s ease calc((72 - var(--i)) * 2.5ms)}
.hold.done .lit line{opacity:1;stroke:var(--jade);transition:opacity .2s}
.hold:not(.holding):not(.done) .ring{animation:breath 4.4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.035);opacity:.82}}
.needle-rot{position:absolute;inset:0;transform:rotate(0deg);transition:transform .7s var(--spring);pointer-events:none}
.needle{position:absolute;left:50%;top:-3px;width:3px;height:22px;margin-left:-1.5px;background:var(--needle);border-radius:2px;box-shadow:0 0 16px rgba(231,254,85,.75)}
.hold.holding .needle-rot{transform:rotate(360deg);transition:transform var(--ms) linear}
.hold.done .needle-rot{transform:rotate(360deg);opacity:0;transition:opacity .4s}
.disc{position:absolute;left:21%;top:21%;width:58%;height:58%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#FFFFFF,#EFE9EB 62%,#DCD3D7);color:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 12px rgba(255,255,255,.05),0 24px 50px -12px rgba(0,0,0,.7),inset 0 -8px 16px rgba(0,0,0,.08);transition:transform .55s var(--spring);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.disc small{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#4A4346}
.hold.holding .disc{transform:scale(.92);transition:transform var(--ms) cubic-bezier(.2,.8,.2,1)}
.hold.done .disc{animation:pop .8s var(--spring)}
@keyframes pop{0%{transform:scale(.88)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
.trio{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.trio span{padding:7px 12px;border-radius:999px;background:rgba(20,19,21,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font:400 13px var(--sans);color:rgba(255,255,255,.8)}
.trio b{font-weight:500;color:#fff}
.trio .hl{background:#fff;color:#433C3F}
.trio .hl b{color:var(--night)}
.trio.light span{background:rgba(28,26,27,.06);color:var(--ink-2)}
.trio.light b{color:var(--ink)}
.trio.light .hl{background:var(--ink);color:rgba(255,252,247,.82)}
.trio.light .hl b{color:var(--paper)}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sites .gchip{padding:8px 6px;font-size:14px}
.sealed .trio{opacity:.9}
h2.swap{opacity:0;transform:translate3d(0,6px,0);transition:opacity .2s,transform .2s}
h2{transition:opacity .3s ease,transform .45s var(--spring)}
/* side effects */
.sxgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sx{position:relative;isolation:isolate;min-height:64px;padding:10px;border-radius:20px;background:rgba(20,19,21,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);display:flex;align-items:center;gap:10px;text-align:left;color:#fff;transition:transform .45s var(--spring)}
.sx::before{content:"";position:absolute;inset:0;border-radius:inherit;background:#fff;opacity:0;transform:scale(.86);transition:opacity .2s,transform .5s var(--spring);z-index:-1}
.sx::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 12px 20px -14px rgba(0,0,0,.9);z-index:-2;transition:opacity .2s}
.sx .gi{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.1)}
.sx .gi svg{width:19px;height:19px}
.sx b{font:400 14.5px/1.2 var(--sans);flex:1;min-width:0}
.sx .ck{width:20px;height:20px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.3);transition:opacity .2s,transform .55s var(--spring);flex:none}
.sx .ck svg{width:12px;height:12px}
.sx[aria-pressed="true"]{color:var(--night)}
.sx[aria-pressed="true"]::before{opacity:1;transform:none}
.sx[aria-pressed="true"] .gi{background:rgba(20,19,21,.07)}
.sx[aria-pressed="true"] .ck{opacity:1;transform:none}
.sx:active{transform:translateY(1.5px) scale(.96)}
.sx:active::after{opacity:0}
.sev{position:relative;margin-top:12px;padding-left:44px}
.sev-track{position:absolute;left:0;top:0;bottom:0;width:44px;touch-action:none}
.sev-track::before{content:"";position:absolute;left:21px;top:26px;bottom:26px;width:2px;background:rgba(255,255,255,.18);border-radius:1px}
.sev-fill{position:absolute;left:21px;top:0;width:2px;height:100%;background:linear-gradient(rgba(255,255,255,.5),#fff);transform-origin:top;transform:scaleY(0);transition:transform .6s var(--spring-soft)}
.sev-run{position:absolute;left:0;top:0;width:44px;height:0;transition:transform .6s var(--spring)}
.sev-knob{position:absolute;left:8px;top:-14px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.45);transition:transform .45s var(--spring),opacity .3s}
.sev-knob::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--needle);box-shadow:0 0 0 1px rgba(20,19,21,.2)}
.sev[data-set="false"] .sev-knob{opacity:0;transform:scale(.4)}
.sev.drag .sev-run,.sev.drag .sev-fill{transition:none}
.sev.drag .sev-knob{transform:scale(1.15)}
.sev-o{position:relative;isolation:isolate;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border-radius:18px;text-align:left;color:#fff;transition:transform .45s var(--spring)}
.sev-o::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.1);opacity:0;transition:opacity .25s;z-index:-1}
.sev-o[aria-pressed="true"]::before{opacity:1}
.sev-o:active{transform:scale(.98)}
.sev-o span{font:400 16px/1.25 var(--sans)}
.sev-o small{display:block;font:400 13.5px var(--sans);color:rgba(255,255,255,.72);margin-top:2px}
.sev-n{position:absolute;left:-28px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:rgba(255,255,255,.34)}
.ta-d{width:100%;min-height:96px;border-radius:20px;border:0;background:rgba(20,19,21,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#fff;padding:14px 16px;font:400 15.5px/1.4 var(--sans);resize:vertical;outline:none}
.ta-d::placeholder{color:rgba(255,255,255,.62)}
.ta-d:focus{box-shadow:inset 0 0 0 1.5px var(--needle)}
.stage label{cursor:text}
/* mood and energy */
.moods{display:flex;justify-content:space-between;gap:4px}
.mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;min-height:44px;color:#fff;font:400 13px var(--sans);transition:transform .45s var(--spring)}
.mood i{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),transparent 58%),var(--mc);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .55s var(--spring)}
.mood[aria-pressed="true"] i{transform:scale(1.16);box-shadow:0 0 0 3px var(--night),0 0 0 5px #fff,0 0 30px var(--mc)}
.mood:active i{transform:scale(.9)}
.m-rough{--mc:#8E6A8F}.m-calm{--mc:#B99BC4}.m-dose{--mc:#D9A3A0}.m-jade{--mc:#A6CFB8}.m-bright{--mc:#C9E6B4}
.seg.glass-d.wide{display:flex;width:100%}
.seg.glass-d.wide button{flex:1}
.feel-note{margin-top:22px;opacity:0;transform:translate3d(0,10px,0);visibility:hidden;transition:opacity .4s ease,transform .55s var(--spring),visibility 0s linear .4s}
.feel-note.on{opacity:1;transform:none;visibility:visible;transition:opacity .4s ease,transform .55s var(--spring),visibility 0s}
/* quick log tiles */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qgrid.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qt{position:relative;isolation:isolate;overflow:hidden;min-height:96px;border-radius:26px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:#fff;background:rgba(20,19,21,.52);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);transition:transform .5s var(--spring)}
.qt::after{content:"";position:absolute;width:150px;height:150px;right:-56px;bottom:-70px;border-radius:50%;background:radial-gradient(closest-side,var(--qc),transparent);opacity:.6;z-index:-1;transition:transform .6s var(--spring)}
.qt .gi{background:rgba(255,255,255,.1)}
.qt b{font:400 16px var(--sans);letter-spacing:-.01em}
.qt:active{transform:scale(.95)}
.qt:active::after{transform:scale(1.25)}
.q-jade{--qc:#A6CFB8}.q-calm{--qc:#D0A8C9}.q-brand{--qc:#D9A3A0}
/* protein */
.bigbtns{display:flex;justify-content:center;gap:14px}
.bb{position:relative;width:84px;height:84px;border-radius:50%;background:rgba(20,19,21,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 14px 26px -16px rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:transform .5s var(--spring)}
.bb b{font:300 26px/1 var(--sans);letter-spacing:-.04em}
.bb small{font:500 10px var(--mono);color:rgba(255,255,255,.72)}
.bb:active{transform:scale(.9) translateY(2px)}
.bars{position:relative;display:flex;gap:8px;height:124px}
.bar{flex:1;height:100%;position:relative}
.bar i{position:absolute;left:18%;right:18%;bottom:22px;top:0;border-radius:6px;background:rgba(255,255,255,.34);transform-origin:bottom;transition:transform .9s var(--spring)}
.bar span{position:absolute;bottom:0;left:0;right:0;text-align:center;font:500 11px var(--mono);color:rgba(255,255,255,.86)}
.bar.today span{color:var(--needle)}
.bars .goal{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.45);bottom:calc(22px + (100% - 22px) * var(--g,1));transition:bottom .6s}
/* milestone */
.mile{display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;flex:1}
.mile-num{margin:22px 0 10px}
.mile .serif{max-width:330px;margin-top:12px}

/* clinical alert: flat, hard-edged, no glow */
.alarm-card{background:var(--alarm);color:var(--alarm-ink);border-radius:8px;padding:18px 18px 10px}
.alarm-card h2{font:400 22px/1.2 var(--sans);letter-spacing:-.02em;margin-top:10px;color:#fff}
.alarm-card p{font:400 15px/1.45 var(--sans);margin-top:8px}
.al-top{display:flex;gap:8px;align-items:center;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.al-top svg{width:18px;height:18px}
.al-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:6px;background:var(--alarm-ink);color:var(--alarm);font:500 16px var(--sans);margin-top:10px;transition:transform .2s ease}
.al-btn svg{width:20px;height:20px}
.al-btn:active{transform:scale(.98)}
.al-btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.66);margin-top:8px}
.al-link{min-height:44px;color:#fff;text-decoration:underline;text-underline-offset:4px;font:500 15px var(--sans);display:inline-flex;align-items:center}
.alarm-inline{display:none;margin-top:12px;background:var(--alarm);color:var(--alarm-ink);border-radius:6px;padding:14px 16px;font:400 15px/1.45 var(--sans)}
.alarm-inline b{color:#fff;font-weight:500}
.alarm-inline.on{display:block;animation:alarmIn .3s ease both}
@keyframes alarmIn{from{opacity:0}}
#pages .page.alarm{background:var(--alarm);color:var(--alarm-ink);transform:translate3d(0,100%,0);transition:transform .42s cubic-bezier(.2,.8,.2,1);box-shadow:none}
#pages .page.alarm.in{transform:none}
.alarm{height:100%;display:flex;flex-direction:column}
.alarm .pscroll{padding-top:4px}
.alarm h2{margin-top:14px;color:#fff}
.al-p{font:400 17px/1.45 var(--sans);margin-top:12px;color:#FFE9E4}
.al-p.s{font-size:15px}
.numbox{margin-top:20px;border:1.5px solid rgba(255,255,255,.55);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:6px}
.numbox b{font:300 40px/1 var(--sans);letter-spacing:-.03em;color:#fff}
.numbox span{font:400 14px/1.4 var(--sans);color:#FFE3DD}
.pfoot.al{background:var(--alarm);box-shadow:none;gap:0}
.ico.al{background:rgba(255,255,255,.14);color:#fff;border-radius:8px;box-shadow:none}
.numbox-d{display:flex;flex-direction:column;gap:6px}
.numbox-d b{font:300 40px/1 var(--sans);letter-spacing:-.03em;color:#fff}
.numbox-d span{font:400 14px/1.4 var(--sans);color:rgba(255,255,255,.8)}

/* ---------- Progress ---------- */
.p-hero{display:flex;flex-direction:column;padding-bottom:46px}
.p-hero .seg{align-self:flex-start;margin:14px 20px 0;position:relative;z-index:7}
.chart{position:relative;flex:1;min-height:170px;margin:12px 0 0;touch-action:pan-y;cursor:crosshair}
.chart-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2}
.p-hero .chart-line{position:absolute;inset:0;overflow:hidden;view-transition-name:trend;pointer-events:none;z-index:5}
.chart-line>div{position:absolute;inset:0}
.chart-line svg{width:100%;height:100%;display:block;overflow:visible}
.ax{font:400 11px var(--mono);fill:var(--ink-2)}
.capsule{position:absolute;left:0;top:-8px;bottom:-4px;width:64px;border-radius:32px;background:rgba(255,252,247,.42);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 12px 26px -16px rgba(28,26,27,.4);display:flex;flex-direction:column;align-items:center;padding:10px 0 28px;transition:transform .55s var(--spring);z-index:4;opacity:0}
.capsule.flip{justify-content:flex-end}
.chart.scrub .capsule{transition:transform .14s ease-out}
.cap-v{font:400 17px/1.1 var(--sans);letter-spacing:-.03em}
.cap-u{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);min-height:11px}
.cap-d{position:absolute;bottom:9px;font:400 10.5px var(--mono);color:var(--ink-2)}
.cap-dot{position:absolute;left:0;top:0;z-index:6;pointer-events:none;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--needle);box-shadow:0 0 0 2px var(--ink);transition:transform .55s var(--spring)}
.chart.scrub .cap-dot{transition:transform .14s ease-out}
.chart-empty{position:absolute;left:20px;right:20px;top:40%;text-align:center;color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 20px 0;font:400 12.5px var(--sans);color:var(--ink-2);position:relative;z-index:7}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.lg-line{width:16px;height:2px;background:var(--ink)}
.lg-band{width:16px;height:9px;border-radius:3px;background:rgba(255,255,255,.6);border-top:1px dotted var(--ink)}
.lg-tick{width:2px;height:9px;background:#7E3F5F}
.lg-hint{margin-left:auto;font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.sec .micro{color:var(--mute)}
.mrow{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none;padding-bottom:2px}
.mrow::-webkit-scrollbar{display:none}
.mchip{flex:none;min-width:86px;min-height:66px;padding:10px 14px;border-radius:22px;background:rgba(28,26,27,.05);display:flex;flex-direction:column;gap:2px;text-align:left;transition:transform .45s var(--spring)}
.mchip b{font:300 22px/1.1 var(--sans);letter-spacing:-.035em}
.mchip span{font:400 11.5px var(--mono);color:var(--mute)}
.mchip.on{background:var(--ink);color:var(--paper)}
.mchip.on span{color:rgba(255,252,247,.76)}
.mchip.day0{background:var(--sage-l);color:var(--ink)}
.mchip.day0 span{color:var(--ink-2)}
button.mchip:active{transform:scale(.95)}
.record-row{display:flex;gap:16px;align-items:center;padding:16px;border-radius:28px;background:var(--paper)}
.record-row>svg{width:124px;height:124px;flex:none}
.count{font:300 54px/1 var(--sans);letter-spacing:-.06em;margin-top:8px}
.screen.first .seed,.stage.enter .seed{animation:seedIn .7s var(--spring) both;animation-delay:calc(var(--i) * 22ms + .4s)}
.seed{transform-box:fill-box;transform-origin:center}
@keyframes seedIn{from{transform:scale(0);opacity:0}}

/* light rows, chips, options */
.rows{background:var(--paper);border-radius:26px;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 16px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:rgba(28,26,27,.07)}
.row .k{flex:1;min-width:0;font:400 15.5px/1.3 var(--sans);display:flex;flex-direction:column;gap:2px}
.row small{font:400 13.5px/1.35 var(--sans);color:var(--mute)}
.row .v{font:400 14.5px var(--sans);color:var(--mute);text-align:right}
.row .v b{color:var(--ink);font-weight:500}
.page .micro{margin:24px 16px 8px}
.page .pscroll>.micro:first-child{margin:4px 0 0}
.page .pscroll .nextstep .micro,.page .pscroll .paper .micro{margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;isolation:isolate;min-height:44px;padding:0 16px;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(28,26,27,.12);font:400 14.5px var(--sans);display:inline-flex;align-items:center;gap:6px;transition:transform .45s var(--spring)}
.chip::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--ink);opacity:0;transform:scale(.8);transition:opacity .2s,transform .5s var(--spring);z-index:-1}
.chip::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 8px 14px -10px rgba(28,26,27,.5);z-index:-2;transition:opacity .2s}
.chip[aria-pressed="true"]{color:var(--paper)}
.chip[aria-pressed="true"]::before{opacity:1;transform:none}
.chip:active{transform:translateY(1.5px) scale(.95)}
.chip:active::after{opacity:0}
.chip-s{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(28,26,27,.06);font:500 13px var(--sans)}
.chip-s svg{width:14px;height:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;gap:12px;align-items:center;min-height:56px;padding:12px 16px;border-radius:20px;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(28,26,27,.1);text-align:left;font:400 15.5px/1.35 var(--sans);transition:transform .45s var(--spring)}
.opt:active{transform:scale(.98)}
.opt .box{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(28,26,27,.32);display:grid;place-items:center;color:transparent;flex:none;transition:transform .5s var(--spring)}
.opt .box svg{width:14px;height:14px}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt[aria-pressed="true"] .box{background:var(--ink);color:var(--paper);box-shadow:none;transform:scale(1.08)}
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:rgba(28,26,27,.07)}
.seg button{position:relative;z-index:1;min-height:44px;min-width:64px;padding:0 16px;border-radius:999px;font:500 14px var(--sans)}
.seg .thumb{position:absolute;top:4px;left:0;height:calc(100% - 8px);border-radius:999px;background:var(--paper);box-shadow:0 2px 8px -2px rgba(0,0,0,.18);transition:transform .55s var(--spring)}
.seg.glass{background:rgba(255,255,255,.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.seg.glass-d{background:rgba(20,19,21,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.seg.glass-d button{color:#fff}
.seg.glass-d button[aria-pressed="true"]{color:var(--night)}
.seg.glass-d .thumb{background:#fff}
.concern{background:#F3E6D4;border-radius:18px;padding:14px 16px;font:400 15px/1.45 var(--sans)}
.concern b{display:block;font-weight:500}
.paper{background:var(--paper);border-radius:22px;padding:16px}
.paper .micro{margin:0}
.paper b{font-weight:500}
.sage-card{background:var(--sage);border-radius:24px;padding:12px}
.sage-card svg{display:block;width:100%;height:auto}
.cv{font:400 11.5px var(--mono);fill:var(--ink-2)}
.steps-list{list-style:none;padding:0;display:flex;flex-direction:column}
.steps-list li{display:flex;gap:14px;padding:14px 0;border-top:1px solid rgba(28,26,27,.08)}
.steps-list .no{font:400 13px var(--mono);color:var(--mute);width:24px;padding-top:2px;flex:none}
.steps-list li.done .no{color:var(--ink)}
.steps-list .k{display:flex;flex-direction:column;gap:3px;font:500 15.5px var(--sans)}
.steps-list small{font:400 14.5px/1.4 var(--sans);color:var(--mute)}
.meline{display:flex;gap:14px;align-items:center;padding:8px 4px}
.meline b{display:block;font:500 17px var(--sans)}
.ta{width:100%;min-height:130px;border-radius:22px;border:0;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(28,26,27,.12);padding:14px 16px;font:400 15.5px/1.45 var(--sans);resize:vertical;outline:none}
.ta:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:center;padding:6px 6px 6px 16px;border-radius:20px;background:var(--paper);font:400 15px/1.35 var(--sans)}
.q span{flex:1}
.q .ico{box-shadow:none;background:transparent}

/* care */
.c-hero{padding-bottom:56px}
.team{position:relative;z-index:7;display:flex;gap:12px;align-items:center;padding:18px 20px 0}
.team b{display:block;font:500 16px var(--sans)}
.team .serif{color:var(--ink-2)}
.c-hero .face{box-shadow:0 0 0 2px var(--mist)}
.honest{display:flex;gap:8px;align-items:flex-start;font:400 14px/1.45 var(--sans);color:var(--ink-2)}
.honest svg{width:16px;height:16px;flex:none;margin-top:2px}
.c-hero .honest{padding:12px 20px 0;position:relative;z-index:7}
.c-hero .pill-cta{margin:18px 20px 0;width:calc(100% - 40px);z-index:7}
.convo{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:18px 18px 8px;border-radius:28px;background:var(--paper);box-shadow:0 14px 30px -24px rgba(28,26,27,.4);transition:transform .45s var(--spring)}
.convo:active{transform:scale(.985)}
.convo .micro{margin:0}
.urgent-card{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:26px;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(122,21,39,.2)}
.urgent-card .serif{margin-top:4px;color:var(--ink-2)}
.urgent-card .link{margin-top:2px}
/* the loop: line, four stations, a travelling dot */
.loop{position:relative;display:block;height:22px;margin:10px 11px 0;container-type:inline-size}
.loop.mini{margin:8px 11px 2px}
.lp-line{position:absolute;left:0;right:0;top:10px;height:2px;background:rgba(28,26,27,.12);border-radius:1px}
.lp-fill{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--ink);transform-origin:left;transform:scaleX(var(--p));transition:transform 1.1s var(--spring-soft) .2s}
.lp-n{position:absolute;top:6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px rgba(28,26,27,.3)}
.lp-n.on{background:var(--ink);box-shadow:none}
.lp-run{position:absolute;left:0;top:0;width:0;height:22px;transform:translateX(calc(var(--p) * 100cqw));transition:transform 1.1s var(--spring-soft) .2s;pointer-events:none}
.lp-dot{position:absolute;left:-11px;top:0;width:22px;height:22px;border-radius:50%;background:var(--ink);box-shadow:0 4px 12px -2px rgba(28,26,27,.45)}
.lp-dot::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--needle)}
.loop.still .lp-run,.loop.still .lp-fill{transition:none}
.lp-labels{display:flex;justify-content:space-between;font:500 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.lp-labels .on{color:var(--ink)}
.convo .link{align-self:flex-start}
.status-card{background:var(--paper);border-radius:28px;padding:16px 18px 14px}
.vloop{position:relative;padding-left:34px;--row:44px}
.vl-track{position:absolute;left:10px;top:22px;height:calc(var(--row) * 3);width:2px;background:rgba(28,26,27,.12)}
.vl-fill{position:absolute;inset:0;background:var(--ink);transform-origin:top;transform:scaleY(calc(var(--p) / 3));transition:transform 1s var(--spring-soft)}
.vl-run{position:absolute;left:-10px;top:0;width:22px;height:22px;margin-top:-11px;transform:translate3d(0,calc(var(--p) * var(--row)),0);transition:transform 1s var(--spring-soft)}
.vl-dot{position:absolute;inset:0;border-radius:50%;background:var(--ink);box-shadow:0 4px 12px -2px rgba(28,26,27,.45)}
.vl-dot::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--needle)}
.vloop.still .vl-fill,.vloop.still .vl-run{transition:none}
.vl-row{position:relative;height:var(--row);display:flex;align-items:center;gap:10px;font:400 15px var(--sans);color:var(--mute);transition:color .3s}
.vl-row.done{color:var(--ink)}
.vl-row.now span{font-weight:500}
.vl-row time{margin-left:auto;font:400 12px var(--mono);color:var(--mute)}
.vl-n{position:absolute;left:-29px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px rgba(28,26,27,.3);transition:transform .5s var(--spring)}
.vl-row.done .vl-n{background:var(--ink);box-shadow:none}
.status-card .honest{margin-top:10px;padding-top:12px;border-top:1px solid rgba(28,26,27,.07)}
.msgs{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.msg{max-width:86%;padding:12px 15px;border-radius:22px;font:400 15.5px/1.42 var(--sans);animation:msgIn .55s var(--spring) both}
@keyframes msgIn{from{opacity:0;transform:translate3d(0,10px,0) scale(.97)}}
.msg.them{background:var(--paper);align-self:flex-start;border-bottom-left-radius:8px}
.msg.me{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:8px}
.msg .who{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.msg .when{display:block;font:400 11.5px var(--mono);opacity:.72;margin-top:6px}
.msg.sys{align-self:center;background:none;font:italic 400 14.5px/1.4 var(--serif);color:var(--mute);text-align:center;max-width:92%}
.rep b{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,252,247,.74);margin-bottom:4px}
.rep span{display:block}
.nextstep{background:var(--sage-l);border-radius:28px;padding:18px;animation:rise .7s var(--spring-soft) both}
.nextstep .micro{margin:0 0 10px;color:var(--ink-2)}
.nextstep .serif{color:var(--ink-2)}
.nextstep .fine{color:var(--ink-2)}
.ns-act{display:flex;flex-direction:column;align-items:center;gap:4px}
.ns-act .pill-cta{margin-top:0}
.compose{display:flex;gap:8px;align-items:flex-end;width:100%}
.compose textarea{flex:1;min-height:48px;max-height:120px;border-radius:24px;border:0;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(28,26,27,.14);padding:13px 16px;resize:none;font:400 15.5px/1.35 var(--sans);outline:none}
.compose textarea:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.send{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none;transition:transform .45s var(--spring)}
.send:active{transform:scale(.9)}
.send svg{width:20px;height:20px}
.urgent-line{font:400 14px/1.45 var(--sans);color:var(--ink-2);text-align:center}
.weeks{display:flex;flex-direction:column;gap:8px}
.wk{background:var(--paper);border-radius:22px;overflow:hidden}
.wk summary{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;cursor:pointer;list-style:none}
.wk summary::-webkit-details-marker{display:none}
.wk summary .k{flex:1;display:flex;flex-direction:column;font:500 15px var(--sans)}
.wk summary small{font:400 13px var(--sans);color:var(--mute)}
.wk summary .v{font:400 14px var(--mono);color:var(--ink-2)}
.wk summary .chev{transition:transform .45s var(--spring)}
.wk[open] summary .chev{transform:rotate(90deg)}
.wd{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.wd div{font:400 14px var(--sans)}
.wd span{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.okdot,.gapdot{width:10px;height:10px;border-radius:50%;flex:none}
.okdot{background:var(--ink)}
.gapdot{box-shadow:inset 0 0 0 1.5px rgba(28,26,27,.35)}
.sharecard{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;max-height:56vh;margin:0 auto}
.sharecard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sharecard .in{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 22px;background:linear-gradient(rgba(20,19,21,0),rgba(20,19,21,.78) 45%,rgba(20,19,21,.9));color:#fff}
.serif.big{font-size:26px;line-height:1.15}
.swm{width:120px;margin-top:14px;color:#fff}
.swm svg{width:100%;height:auto;display:block}
.frame{position:relative;aspect-ratio:3/4;max-height:52vh;border-radius:28px;overflow:hidden;background:var(--paper);display:grid;place-items:center;color:var(--mute);margin:0 auto}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .ghost{opacity:.4}
.outline{width:46%;height:auto}
.demo-list{display:grid;gap:2px}
.demo-list button{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;padding:8px 12px;border-radius:16px;text-align:left;font:500 15px var(--sans)}
.demo-list b{font:400 12px var(--mono);color:var(--mute);min-width:20px}
.demo-list small{display:block;font:400 13px var(--sans);color:var(--mute)}
.demo-list button:hover{background:var(--paper)}

/* ---------- Toast, lock, loader ---------- */
#toast{position:absolute;left:16px;right:16px;bottom:calc(90px + var(--sab));z-index:60;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;min-height:56px;border-radius:24px;background:rgba(24,22,23,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font:400 14.5px/1.35 var(--sans);opacity:0;transform:translate3d(0,24px,0) scale(.97);transition:opacity .25s ease,transform .55s var(--spring);pointer-events:none;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast span{flex:1}
#toast button{min-height:44px;padding:0 18px;border-radius:999px;background:#fff;color:var(--night);font:500 14px var(--sans);flex:none}
#app.paged #toast,#app.bare #toast{bottom:calc(16px + var(--sab))}
#lock{position:absolute;inset:0;z-index:80;display:none;color:#fff}
#lock.on{display:block}
#lock.opening{animation:leave .5s ease forwards}
.lk{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;gap:10px;text-align:center}
.lk-wm{width:190px;color:#fff;margin-bottom:8px}
.lk-wm svg{width:100%;height:auto;display:block}
.lk .serif{color:rgba(255,255,255,.84)}
.lk .pill-cta{margin-top:18px}
#loader{position:absolute;inset:0;z-index:90;display:none}
#loader.on{display:block}
#loader.out{animation:fadeOut .6s ease forwards}
@keyframes fadeOut{to{opacity:0}}
.ld-wm{position:absolute;left:50%;top:50%;width:200px;margin:-14px 0 0 -100px;color:#fff;z-index:2;animation:ldIn 1.1s var(--spring-soft) both}
.ld-wm svg{width:100%;height:auto;display:block}
@keyframes ldIn{from{opacity:0;transform:translate3d(0,12px,0) scale(.96)}}
#loader .aura .core{animation:ldCore 1.4s var(--out) both}
@keyframes ldCore{from{transform:scale(1.7)}to{transform:scale(1)}}

/* ---------- Entrances ---------- */
@keyframes rise{from{opacity:0;transform:translate3d(0,18px,0)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
.obbody:not(.quiet) .rise{animation:rise .85s var(--spring-soft) both;animation-delay:calc(var(--d,0) * 80ms + 100ms)}
.ret .rise{animation:rise .9s var(--spring-soft) both;animation-delay:calc(var(--d,0) * 90ms + .62s)}
.ret .hdr{animation:fadeIn .6s ease .55s both}
.stage.enter .st-scroll>*{animation:rise .75s var(--spring-soft) .1s both}
.stage.enter .st-scroll>:nth-child(2){animation-delay:.16s}.stage.enter .st-scroll>:nth-child(3){animation-delay:.22s}.stage.enter .st-scroll>:nth-child(4){animation-delay:.28s}.stage.enter .st-scroll>:nth-child(5){animation-delay:.34s}.stage.enter .st-scroll>:nth-child(6){animation-delay:.4s}.stage.enter .st-scroll>:nth-child(n+7){animation-delay:.46s}
.stage.enter .st-foot{animation:rise .75s var(--spring-soft) .3s both}
.stage.enter .qgrid .qt{animation:rise .7s var(--spring) both;animation-delay:calc(var(--d) * 45ms + .12s)}
.stage.enter .mile .rise{animation:rise .9s var(--spring-soft) both;animation-delay:calc(var(--d,0) * 120ms + .5s)}
.screen.first .h-copy>*{animation:rise .9s var(--spring-soft) both}
.screen.first .h-copy>:nth-child(2){animation-delay:.08s}.screen.first .h-copy>:nth-child(3){animation-delay:.16s}
.screen.first .capsule-h{animation:capIn 1s var(--spring) 1.25s both}
@keyframes capIn{from{opacity:0;transform:translate3d(0,14px,0) scale(.86)}}
.screen.first .hlab{animation:fadeIn .6s ease 1.1s both}
.screen.first .body>*{animation:rise .85s var(--spring-soft) both}
.screen.first .body>:nth-child(1){animation-delay:.3s}.screen.first .body>:nth-child(2){animation-delay:.38s}.screen.first .body>:nth-child(3){animation-delay:.46s}.screen.first .body>:nth-child(n+4){animation-delay:.54s}

/* ---------- Shared-element tab morph (FLIP ghost panel + fade-through) ---------- */
#view.morphing>.screen{background:transparent}
#view.morphing .hero{background:transparent!important}
.m-ghost{position:absolute;left:0;right:0;z-index:0;transform-origin:50% 0;will-change:transform,opacity;pointer-events:none}
#view>.screen{z-index:1}
#view>.screen.m-new{z-index:2;opacity:0}
#view>.screen.m-new.go{opacity:1;transition:opacity .34s var(--out) .1s}
#view>.screen.m-old.go{opacity:0;transition:opacity .15s ease-in;pointer-events:none}
.m-new .h-copy,.m-new .chart,.m-new .team{transform:translate3d(0,10px,0);transition:transform .6s var(--spring-soft) .08s}
.m-new.go .h-copy,.m-new.go .chart,.m-new.go .team{transform:none}
/* (legacy View Transition rules kept harmless) */
::view-transition-group(*){animation-duration:.66s;animation-timing-function:var(--spring-soft)}
::view-transition-old(root){animation:vtOut .14s ease-in both}
::view-transition-new(root){animation:vtIn .36s var(--out) .1s both}
::view-transition-old(trend),::view-transition-new(trend){height:100%;width:100%;object-fit:fill}
::view-transition-old(hero),::view-transition-new(hero){height:100%;object-fit:cover;object-position:top}
::view-transition-old(hero){animation:vtOut .3s ease both}
::view-transition-new(hero){animation:vtIn .45s ease .08s both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0}}

/* ---------- Reduced motion: calm fades, nothing moves ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .pal i,.la-glow{animation:none!important}
  #pages .page,#pages .page.sheet,#pages .page.alarm{transform:none!important;opacity:0;transition:opacity .25s ease!important}
  #pages .page.in{opacity:1}
  #app.paged:not(.sheeted) #view,#app.sheeted #view{transform:none}
  .fog{display:none}
  .lp-run,.lp-fill,.vl-run,.vl-fill,.capsule,.cap-dot,.sev-run,.sev-fill,.tl-needle,.tl-fill,.needle-rot,.ind,#tabs .ind,.seg .thumb,.sw::after{transition:none!important}
  .dm i{transition:opacity .2s ease!important;transform:none!important}
  #toast{transform:none;transition:opacity .2s ease}
  .gchip,.chip,.sx,.qt,.pill-cta,.mood i,.disc,.bb,.tile,.ed,.attn{transition:none!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

</style>

/* ---------- Motion: damped springs sampled into CSS linear(), and a JS spring for instruments ---------- */
function springCurve(k,c){ const m=1, w0=Math.sqrt(k/m), z=c/(2*Math.sqrt(k*m)); const wd_=w0*Math.sqrt(Math.max(1e-6,1-z*z));
  const x=z<1?(t=>1-Math.exp(-z*w0*t)*(Math.cos(wd_*t)+(z*w0/wd_)*Math.sin(wd_*t))):(t=>1-Math.exp(-w0*t)*(1+w0*t));
  let T=0; for(let t=0;t<4;t+=0.004){ if(Math.abs(1-x(t))>0.002) T=t; } T+=0.02; return {x,T}; }
const SPRING=springCurve(180,19), SOFT=springCurve(110,17), SNAP=springCurve(320,30);
(function(){ try{ if(!CSS.supports('transition-timing-function','linear(0, 1)')) return; const R=document.documentElement.style;
  [['--spring',SPRING],['--spring-soft',SOFT],['--spring-snap',SNAP]].forEach(([n,s])=>{ const k=48, pts=[]; for(let i=0;i<=k;i++) pts.push(+s.x(s.T*i/k).toFixed(4)); pts[k]=1; R.setProperty(n,'linear('+pts.join(',')+')'); R.setProperty(n+'-d',Math.round(s.T*1000)+'ms'); }); }catch(e){} })();
const springAt=k=>SPRING.x(SPRING.T*Math.min(1,k));
function countUp(el,to,dp=1,ms=900,from){ if(!el) return; if(reduce){ el.textContent=to.toFixed(dp); return; } const f=from!=null?from:(parseFloat(el.dataset.from)||0); const t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/ms), e=springAt(k); el.textContent=(f+(to-f)*e).toFixed(dp); if(k<1) requestAnimationFrame(step); else el.textContent=to.toFixed(dp); }; requestAnimationFrame(step); }
/* physical spring with initial velocity; x and v in user units, time in seconds */
function springTo(from,to,v0,onFrame,onDone,k=260,c=28){ let x=from, v=v0, last=performance.now(), id=0, live=true;
  if(reduce){ onFrame(to); onDone&&onDone(); return {stop(){}}; }
  const step=now=>{ if(!live) return; let dt=Math.min(.032,(now-last)/1000); last=now; for(let s=0;s<4;s++){ const h=dt/4, a=-k*(x-to)-c*v; v+=a*h; x+=v*h; }
    if(Math.abs(x-to)<1e-4&&Math.abs(v)<1e-3){ onFrame(to); live=false; onDone&&onDone(); return; } onFrame(x); id=requestAnimationFrame(step); };
  id=requestAnimationFrame(step); return {stop(){ live=false; cancelAnimationFrame(id); }}; }
