const DMF={
  '0':['01110','10001','10001','10001','10001','10001','01110'],'1':['00100','01100','00100','00100','00100','00100','01110'],
  '2':['01110','10001','00001','00010','00100','01000','11111'],'3':['11110','00001','00001','01110','00001','00001','11110'],
  '4':['00010','00110','01010','10010','11111','00010','00010'],'5':['11111','10000','11110','00001','00001','10001','01110'],
  '6':['00110','01000','10000','11110','10001','10001','01110'],'7':['11111','00001','00010','00100','01000','01000','01000'],
  '8':['01110','10001','10001','01110','10001','10001','01110'],'9':['01110','10001','10001','01111','00001','00010','01100'],
  '.':['0','0','0','0','0','0','1'],'%':['11000','11001','00010','00100','01000','10011','00011'],'-':['00000','00000','00000','01110','00000','00000','00000'],
  '+':['00000','00100','00100','11111','00100','00100','00000'],'v':['00000','00001','00011','10110','11100','01000','00000'],' ':['000','000','000','000','000','000','000']
};
function dmLayout(t){ let x=0; const g=[...String(t)].map(ch=>{ const f=DMF[ch]||DMF['0'], w=f[0].length, o={ch,x,w,f}; x+=w+1; return o; }); return {g,W:Math.max(1,x-1)}; }
function dmSVG(t,{label,cls='',scatter=false}={}){ const L=dmLayout(t); let s='';
  /* HTML dots, not SVG circles: their opacity and transform transitions run on the compositor */
  L.g.forEach((g,gi)=>{ for(let r=0;r<7;r++) for(let c=0;c<g.w;c++){ const on=g.f[r][c]==='1'; const tx=scatter?`;--tx:${Math.round((Math.random()-.5)*260)}px;--ty:${Math.round((Math.random()-.5)*300)}px`:'';
    s+=`<i data-g="${gi}" data-r="${r}" data-c="${c}"${on?' class="on"':''} style="left:${((g.x+c)/L.W*100).toFixed(3)}%;top:${(r/7*100).toFixed(3)}%${tx}"></i>`; } });
  return `<span class="dm ${cls}" style="--cols:${L.W};aspect-ratio:${L.W}/7" data-t="${esc(t)}" data-shape="${L.g.map(g=>g.w).join('')}" role="img" aria-label="${esc(label||t)}">${s}</span>`; }
function dmSet(el,t,{fast=false,label}={}){ if(!el) return; t=String(t); if(el.dataset.t===t) return; const L=dmLayout(t), shape=L.g.map(g=>g.w).join('');
  if(label) el.setAttribute('aria-label',label);
  el.classList.toggle('fast',!!fast&&!reduce);
  if(el.dataset.shape!==shape){ const tmp=document.createElement('div'); tmp.innerHTML=dmSVG(t,{label:label||el.getAttribute('aria-label')}); const n=tmp.firstElementChild; n.setAttribute('class',el.getAttribute('class'));
    $$('i',n).forEach(c=>{ c.dataset.on=c.classList.contains('on')?1:0; c.classList.remove('on'); }); el.replaceWith(n); n.getBoundingClientRect();
    $$('i',n).forEach(c=>{ if(c.dataset.on==='1'){ c.style.setProperty('--dl',(fast||reduce?0:(+c.dataset.r*20+(+c.dataset.g)*26+Math.random()*30))+'ms'); c.classList.add('on'); } }); return n; }
  el.dataset.t=t; const cs=$$('i',el);
  cs.forEach(c=>{ const g=L.g[+c.dataset.g], on=g.f[+c.dataset.r][+c.dataset.c]==='1'; if(c.classList.contains('on')!==on){ c.style.setProperty('--dl',(fast||reduce?0:(+c.dataset.r*22+(+c.dataset.c)*8+(+c.dataset.g)*24+Math.random()*24))+'ms'); c.classList.toggle('on',on); } });

    strip.style.backgroundPosition=`${off(st.major)}px 0, ${off(st.mid||st.major)}px 0, 0 0`;

  const go=auto=>{ if(done||t) return; root.classList.remove('release'); root.classList.add('holding'); let q=0; tick=setInterval(()=>{ q++; buzz(q%4===0?6:2); },ms/12); t=setTimeout(()=>{ t=null; fin(); },ms); /* the hold is a deliberate confirmation, kept under reduced motion; only the visuals calm down */ root.dataset.auto=auto?1:0; };

/* Today hero: weekly 7-day averages as a thin line crossing the photo, the pace guide dotted behind her */
function heroTrend(W,H,T0=0,X1){ const ser=avgSeries(), hide=S.prefs.hideW; const wk=[];
  for(let i=5;i>=0;i--){ const d=addD(TODAY,-i*7); const v=avg7(d); if(v!=null&&d>=S.start.d) wk.push({d,v}); }
  const h=H-T0, x0=-14, x1=X1||W*0.80, yA=T0+Math.max(h*.53,244), yB=yA+Math.max(h*.15,52);
  if(wk.length<2||ser.length<2){ return {line:`<path d="M${x0} ${(yA+yB)/2} H${x1}" class="hl-flat"/>`, pace:'', pts:[], last:[x1,(yA+yB)/2], labels:[], yB}; }
  const vs=wk.map(p=>p.v), band=wk.map(p=>{ const b=bandAt(p.d); return (b[0]+b[1])/2; }); const lo=Math.min(...vs,...band), hi=Math.max(...vs,...band);

/* The record: one seed per dose taken, arranged like the inside of the fruit. It only grows; a missed week stays a soft outline. */
function arilSVG(size=136,opt={}){
  const doses=sortD(S.doses), weeks=Math.max(weekN(),1), miss=missedWeeks(), total=Math.max(26,doses.length+miss.length+4), R=size/2, c=(R-13)/Math.sqrt(total), dark=!!opt.dark;

  for(let i=0;i<total;i++){ const a=i*2.39996, r=c*Math.sqrt(i+.5), x=r*Math.cos(a), y=r*Math.sin(a), rot=a*180/Math.PI+90, kind=seq[i]||'future';

      : kind==='gap'?`<ellipse transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})" rx="4.4" ry="5.8" fill="none" stroke="${dark?'rgba(255,255,255,.4)':'#9C8A97'}" stroke-width="1" stroke-dasharray="2 2"/>`

/* Full trend chart on the sage panel: pace band, daily dots, dose ticks and a frosted capsule you drag to read */
function mountChart(box,mode){ const svg=$('svg',box); if(!svg) return; const r=box.getBoundingClientRect(), W=Math.max(200,r.width), H=Math.max(120,r.height), hide=S.prefs.hideW;
  const isW=mode!=='waist'; const t0=S.start.d, span=Math.max(14,diffD(t0,TODAY)), PB=26, PT=18, PR=hide?18:54, PL=14;
  const X=d=>PL+diffD(t0,d)/span*(W-PR-PL);
  let av, raw=[], band=null;
  if(isW){ av=avgSeries().filter((p,i,a)=>i===a.length-1||i%2===0); raw=sortD(S.weights); band=!hide; }
  else av=sortD(S.waists).map(w=>({d:w.d,v:w.v}));
  const cap=$('.capsule',box);
  if(av.length<2){ svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=`<path d="M0 ${H/2} H${W}" stroke="#1C1A1B" stroke-opacity=".35" stroke-dasharray="2 6" stroke-linecap="round"/>`; cap&&(cap.style.opacity=0); $('.chart-empty',box)&&($('.chart-empty',box).hidden=false); return; }
  let vals=[...av.map(p=>p.v),...raw.map(p=>p.v)]; if(band){ const [lo,hi]=bandAt(TODAY); vals.push(lo,hi,S.start.w); }
  let lo=Math.min(...vals), hi=Math.max(...vals); const pd=(hi-lo)*.1||1; lo-=pd; hi+=pd;
  const Y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB); const pts=av.map(p=>[X(p.d),Y(p.v)]), d=smooth(pts), e=pts[pts.length-1];
  let s='';
  if(!hide){ const ku=isW?cw(1):(isKg()?2.54:1), rg=(hi-lo)*ku, st=[1,2,5,10,20].find(x=>rg/x<=3)||50; for(let g=Math.ceil(lo*ku/st)*st; g<=hi*ku; g+=st){ const v=g/ku, y=Y(v).toFixed(1); s+=`<line x1="${W-PR+8}" x2="${W-PR+20}" y1="${y}" y2="${y}" stroke="#1C1A1B" stroke-opacity=".5"/><text x="${W-PR+24}" y="${(+y+4).toFixed(1)}" class="ax">${g}</text>`; } }
  if(band){ const up=[],dn=[]; for(let i=0;i<=30;i++){ const dd=addD(t0,Math.round(span*i/30)); const [l,h]=bandAt(dd); up.push([X(dd),Y(h)]); dn.push([X(dd),Y(l)]); } const P=a=>a.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'); s+=`<path d="M${P(up)} L${P(dn.reverse())}Z" fill="#FFFFFF" fill-opacity=".34"/>`;
    const mid=[]; for(let i=0;i<=30;i++){ const dd=addD(t0,Math.round(span*i/30)); const [l,h]=bandAt(dd); mid.push([X(dd),Y((l+h)/2)]); } s+=`<path d="${smooth(mid)}" fill="none" stroke="#1C1A1B" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="1.5 5" stroke-linecap="round"/>`; }
  raw.forEach(q=>{ s+=`<circle cx="${X(q.d).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="1.8" fill="#1C1A1B" fill-opacity=".22"/>`; });
  let rv=`<path d="${d}" fill="none" stroke="#1C1A1B" stroke-width="2" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{ if(i%3===0&&i<pts.length-1) rv+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#1C1A1B"/>`; });
  if(isW) S.doses.forEach(q=>{ const x=X(q.d); s+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${H-PB+8}" y2="${H-PB+15}" stroke="#7E3F5F" stroke-width="2" stroke-linecap="round"/>`; });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=s; const hero=box.closest('.hero'), lsv=$('.chart-line svg',hero), HH=hero.offsetHeight; lsv.setAttribute('viewBox',`0 0 ${W} ${HH}`); lsv.innerHTML=`<g transform="translate(0 ${box.offsetTop})">${rv}</g>`; reveal($('.chart-line',hero),$('#view').classList.contains('morphing')?60:120,$('#view').classList.contains('morphing')?700:1200);
  const tip=$('.cap-v',box), tipd=$('.cap-d',box), dot=$('.cap-dot',box); let on=false, k=pts.length-1;
  const show=i=>{ k=i; const x=pts[i][0]; cap.style.transform=`translate3d(${(x-cap.offsetWidth/2).toFixed(1)}px,0,0)`; dot.style.transform=`translate3d(${x.toFixed(1)}px,${pts[i][1].toFixed(1)}px,0)`; cap.classList.toggle('flip',pts[i][1]<70);
    tip.textContent=hide?`Week ${Math.floor(diffD(t0,av[i].d)/7)+1}`:isW?fW(av[i].v):cl(av[i].v).toFixed(1); tipd.textContent=fD(av[i].d); cap.setAttribute('aria-valuetext',`${fD(av[i].d)}: ${hide?'trend shown without numbers':isW?fW(av[i].v)+' '+S.unit:cl(av[i].v).toFixed(1)+' '+lenU()}`); };
  cap.style.opacity=1; show(k);
  const read=cx=>{ const x=cx-svg.getBoundingClientRect().left; let j=0; pts.forEach((p,i)=>{ if(Math.abs(p[0]-x)<Math.abs(pts[j][0]-x)) j=i; }); if(j!==k){ show(j); buzz(2); } };
  box.onpointerdown=e=>{ on=true; box.classList.add('scrub'); read(e.clientX); };
  box.onpointermove=e=>{ if(on) read(e.clientX); };
  box.onpointerup=box.onpointerleave=box.onpointercancel=()=>{ on=false; box.classList.remove('scrub'); };
  cap.onkeydown=e=>{ if(e.key==='ArrowLeft'&&k>0){ e.preventDefault(); show(k-1); } if(e.key==='ArrowRight'&&k<pts.length-1){ e.preventDefault(); show(k+1); } if(e.key==='Home'){ e.preventDefault(); show(0); } if(e.key==='End'){ e.preventDefault(); show(pts.length-1); } };
}

  <button class="al-link" data-act="alertDone">I've spoken to the clinic</button></section>`; }
function heroHTML({W,H,T:T0}){ const h=H-T0, fh=Math.round(h*.88), fw=Math.round(fh*660/1575), fl=Math.round(W-fw*.985), ft=Math.round(T0+h*.07);
  const T=heroTrend(W,H,T0,fl+fw*.5), hide=S.prefs.hideW, a=curAvg(), first=firstToday&&!reduce;
  const short=h<390; const labY=short?T.yB+14:Math.min(T.yB+26,H-58);
  const cap=T.last; const capW=74;
  const capTxt=S.weights.length<2||a==null?`<b class="n">${dayN()<7?`Day ${dayN()+1}`:`Wk ${weekN()}`}</b><small>${S.weights.length?'first entry':'no entries'}</small>`:hide?`<b>Wk ${weekN()}</b><small>trend</small>`:`<b class="n">${fW(a)}</b><small>${S.unit} · avg</small>`;
  const labels=T.labels.map(l=>`<span class="hlab${l.last?' last':''}" style="left:${l.x.toFixed(1)}px"><i class="serif">${MON[parse(l.d).getMonth()].slice(0,3)}</i><b class="n">${pad2(parse(l.d).getDate())}</b></span>`).join('');
  return `<section class="hero sage t-hero" style="height:${H}px">
    <svg class="hl-back" viewBox="0 0 ${W} ${H}" aria-hidden="true">${T.pace}</svg>
    <i class="la-glow" aria-hidden="true" style="left:${Math.round(fl-fw*.4)}px;top:${Math.round(ft+fh*.02)}px;width:${Math.round(fw*1.75)}px;height:${Math.round(fh*.66)}px"></i>
    <div class="hl-front" aria-hidden="true"><div><svg viewBox="0 0 ${W} ${H}">${T.line}${T.pts.slice(0,-1).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"/>`).join('')}</svg></div></div>
    <div class="la-wrap" style="left:${fl}px;top:${ft}px;width:${fw}px;height:${fh}px">${lineArt('full',{draw:first,delay:.15,halo:true})}</div>
    <i class="now-dot" aria-hidden="true" style="left:${cap[0].toFixed(1)}px;top:${cap[1].toFixed(1)}px"></i>
    <button class="capsule-h" data-act="tabGo" data-v="progress" style="left:${(cap[0]-capW/2).toFixed(1)}px;top:${(cap[1]-62).toFixed(1)}px;height:${short?96:Math.max(120,labY+46-(cap[1]-62)).toFixed(0)}px" aria-label="${hide||a==null?'Your trend':`7-day average ${fW(a)} ${S.unit}`}. Open progress">${capTxt}</button>
    ${short?'':`<div class="hl-labels" aria-hidden="true" style="top:${labY.toFixed(0)}px">${labels}</div>`}
    ${hdr()}
    <div class="h-copy"><div class="micro"><span class="nw">${fD(TODAY)} · Week ${weekN()}</span></div>
      <h1 class="d-hero" id="hello">${(()=>{ const h=hour(), part=h<5?'evening':h<12?'morning':h<17?'afternoon':'evening'; return `Good ${part},<br>${esc(S.name)}.`; })()}</h1>
      <p class="serif lede">${statusLine()}</p></div>
    ${WAVE(W)}
  </section>`; }
function vToday(){
  if(returnMode()) return vReturn();

        <p class="serif s">That's your usual day, so you can simply carry on.${ld?` Your last logged dose was ${fDay(ld.d)}.`:''} Not sure after a break? ${RNF} can confirm in one message.</p>

  const msList=[5,10,15].map(p=>{ const m=S.ms.find(x=>x.p===p); return m?`<button class="mchip on" data-act="milestone" data-v="${p}"><b class="n">${p}%</b><span>${fD(m.d)}</span></button>`:`<div class="mchip"><b class="n">${p}%</b><span>Ahead</span></div>`; }).join('');
  const L=sortD(S.labs).pop();

      <div class="seg glass" data-k="cm"><button data-act="chartMode" data-v="weight" aria-pressed="${chartMode==='weight'}">Weight</button><button data-act="chartMode" data-v="waist" aria-pressed="${chartMode==='waist'}">Waist</button></div>
      <div class="chart" id="chart"><svg class="chart-bg" aria-hidden="true"></svg>
        <div class="capsule" tabindex="0" role="slider" aria-label="Read a day on the trend. Use left and right arrows." aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span class="cap-v n"></span><span class="cap-u">${chartMode==='waist'?lenU():hide?'':S.unit}</span><span class="cap-d n"></span></div><i class="cap-dot" aria-hidden="true"></i>
        <p class="chart-empty serif" hidden>Your trend appears after your second entry.</p></div>
      <div class="legend" aria-hidden="true"><span><i class="lg-line"></i>7-day average</span>${chartMode==='weight'&&!hide?'<span><i class="lg-band"></i>Healthy pace</span>':''}${chartMode==='weight'?'<span><i class="lg-tick"></i>Doses</span>':''}<span class="lg-hint">Drag to read a day</span></div>
      <div class="chart-line" aria-hidden="true"><div><svg></svg></div></div>
      ${WAVE(dims.W)}
    </section>
    <div class="body">
      <div class="sec">${micro('Milestones')}<div class="mrow"><div class="mchip on day0"><b class="n">${fD(S.start.d)}</b><span>Day 0</span></div>${msList}</div></div>
      <section class="record-row">${arilSVG(124)}<div>${micro('Your record')}<div class="count n">${S.doses.length}</div><p class="h3">doses taken</p><p class="serif s">${weeksLogged()} weeks of check-ins. It only grows. A missed week leaves a space, never a reset.</p></div></section>
      <button class="ed" data-act="weeks"><span class="ed-ph"><img src="${PH.prints}" alt="A lone walker's footprints across rippled sand" style="object-position:30% 60%"></span><span class="ed-in"><span class="tk">Week by week</span><b>Every week counted</b><span class="serif s">${w} weeks: doses, weigh-ins and how you felt, one week at a time.</span></span></button>
      <button class="ed rev" data-act="photo" data-k="new"><span class="ed-ph"><img src="${PH.fog}" alt="A person and a dog standing on a misty beach" style="object-position:28% 50%"></span><span class="ed-in"><span class="tk">Photos</span><b>See what the scale can't</b><span class="serif s">${S.photos.length?`${S.photos.length} photo${S.photos.length>1?'s':''} saved on this phone.`:'Same spot, same light, once a month. Photos stay on this phone.'}</span></span></button>
      <div class="rows">
        <div class="row"><span class="gi">${I.waist}</span><span class="k">Waist<small>Since day 0</small></span><span class="v n"><b>${wd0>0?'−'+cl(wd0).toFixed(1):'—'}</b> ${lenU()}</span></div>
        ${L?`<div class="row"><span class="gi">${I.leaf}</span><span class="k">${esc(L.name)} ${esc(L.v)}<small>${esc(L.note||'')}</small></span><span class="v">${fD(L.d)}</span></div>`:''}
        <div class="row"><span class="gi">${I.move}</span><span class="k">Movement<small>Last 28 days</small></span><span class="v n"><b>${movesIn(addD(TODAY,-27),TODAY).length}</b> sessions</span></div>

/* closed-loop status: a line, four stations, and a dot that travels to where your message is */
function loopHTML(t,mini){ const idx=STATUSES.indexOf(t.status);

function vloopHTML(t){ const idx=STATUSES.indexOf(t.status), labels=['Sent','Delivered to care team','Nurse replied','Next step'];

function honestLine(t){ return t.status==='sent'?`Sent at ${fTime(t.at.sent)}. We'll show you when it reaches your care team.`

  :t.status==='replied'?`${RNF} replied at ${fTime(t.at.replied)}.`:`${RNF} replied, and your next step is below.`; }

  /* Dose: a press-and-hold ring on a rose aura; it breathes, fills, and blooms into the confirmation */

  missed:()=>`${ph('Missed or late dose')}<div class="pscroll"><h2 class="d-l">If a dose slips</h2><p class="serif">This happens to almost everyone. From your prescription's instructions:</p>

    <div class="paper mt16"><p class="s">Your plan: <b>${S.rx.drug} ${S.rx.mg} mg</b> from a <b>${S.rx.conc} mg/mL</b> vial = <b>${units()} units</b>. Lot ${esc(S.rx.lot)}, from ${PHARM}.</p></div></div>
    <div class="pfoot">${pill(`Message ${RNF} now`,'compose',{attrs:'data-pre="vial"',icon:I.msg})}</div>`,
  check:(a)=>`${sh('Check this number')}<div class="pscroll"><h2 class="d-l">Is ${a.v.toFixed(1)} ${S.unit} right?</h2><p class="serif">It's ${Math.abs(a.diff).toFixed(1)} ${S.unit} ${a.diff>0?'less':'more'} than last time. A slipped digit is easy to do.</p></div>

  fast:()=>`${sh('A quick check-in')}<div class="pscroll"><div class="concern"><b>Losing faster than planned.</b> Your average is dropping faster than 1% a week. That can mean you're not eating or drinking enough.</div>
    <p class="h3 mt20">How have you been eating?</p><div class="opts mt12">${[['ok','I\'m eating and drinking well'],['little','I\'ve been eating very little'],['weak','I feel dizzy or weak']].map(([v,t])=>`<button class="opt" data-act="fastAns" data-v="${v}"><span class="box">${I.tick}</span>${t}</button>`).join('')}</div>
    <p class="serif s mt16">If you faint, feel confused or can't keep water down, call ${EM.e}.</p></div>`,
  /* Quick log: big tactile tiles on a dark stage */
  quick:(a,p)=>{ p.pal='brand'; return `${stTop('Log something')}<div class="pscroll st-scroll">

    </div>`; },
  protein:(a,p)=>{ p.pal='jade'; const pg=protOn(), tgt=protTarget(), wk=[...Array(7)].map((_,i)=>{ const d=addD(TODAY,i-6); return {d,g:protOn(d)}; }), mx=Math.max(tgt,...wk.map(x=>x.g));
    return `${stTop('Protein')}<div class="pscroll st-scroll mid"><div class="readout sm">${dmSVG(String(pg),{label:`${pg} grams today`,cls:'dm-l'})}<span class="u">/ ${tgt} g</span></div><p class="serif c s">Protein helps you keep muscle while you lose fat.</p>
      <div class="bigbtns mt16">${[10,20,30].map(g=>`<button class="bb" data-act="prot" data-v="${g}" aria-label="Add ${g} grams"><b class="n">+${g}</b><small>g</small></button>`).join('')}</div>
      <div class="bars mt24" aria-label="Last 7 days">${wk.map(x=>`<div class="bar${x.d===TODAY?' today':''}"><i style="transform:scaleY(${Math.max(.03,x.g/mx).toFixed(3)})${x.g>=tgt?';background:var(--jade)':''}"></i><span>${DAYS[wd(x.d)][0]}</span></div>`).join('')}<i class="goal" style="--g:${(tgt/mx).toFixed(3)}"></i></div></div>
      <footer class="st-foot">${pill('Done','back',{cls:'on-dark',icon:I.tick})}</footer>`; },
  move:(a,p)=>{ p.pal='jade'; p.m=p.m||{type:'walk',min:30}; const m=p.m;
    return `${stTop('Workout')}<div class="pscroll st-scroll"><p class="h3">What did you do?</p><div class="qgrid three mt12">${MOVES.map(([k,t])=>`<button class="gchip big" data-act="mType" data-v="${k}" aria-pressed="${m.type===k}">${t}</button>`).join('')}</div>

      <div class="ruler-wrap"><div id="mruler"></div></div>
      <p class="serif s c mt12">Strength sessions help protect muscle while your weight changes.</p></div><footer class="st-foot">${pill('Save','moveSave',{cls:'on-dark',icon:I.tick})}</footer>`; },
  /* Mood and energy: the aura takes on the colour of your answer */
  feel:(a,p)=>{ p.f=p.f||{mood:null,energy:null}; const f=p.f; p.pal=f.mood?MOODS.find(m=>m[0]===f.mood)[2]:'calm';

      <div class="feel-note${f.mood==='rough'||f.mood==='low'?' on':''}" id="feelNote"><p class="serif s">Thanks for telling us. If you'd like, ${RNF} can help. You don't need the right words.</p><button class="link-d" data-act="compose" data-pre="low">Message ${RNF}</button></div>
    </div><footer class="st-foot">${pill('Save','feelSave',{cls:'on-dark',icon:I.tick,attrs:f.mood?'':'aria-disabled="true" data-why="Choose how you feel first."'})}</footer>`; },
  /* Side effects: tactile tiles, a severity ruler, and the urgent route always in reach */
  report:(a,p)=>{ p.r=p.r||{sx:[],sev:null,when:null,note:''}; const r=p.r, ok=r.sx.length&&r.sev; p.pal=r.sev==='lot'||r.sev==='fluids'?'rough':'calm';
    const si=SEV.findIndex(s=>s[0]===r.sev);
    return `${stTop('Tell your care team')}<div class="pscroll st-scroll">
      <p class="serif">Reports go to your care team. A nurse replies ${REPLY}.</p>
      <p class="h3 mt20">What's going on?</p><p class="fine">Choose any that fit.</p>
      <div class="sxgrid mt12">${SYMPTOMS.map(([k,t])=>`<button class="sx" data-act="rSx" data-v="${k}" aria-pressed="${r.sx.includes(k)}"><span class="gi">${I['sx_'+k]}</span><b>${t}</b><i class="ck" aria-hidden="true">${chk()}</i></button>`).join('')}</div>
      <p class="h3 mt24">How much is it affecting you?</p>
      <div class="sev" id="sev" style="--k:${si<0?0:si}" data-set="${si>=0}"><div class="sev-track" aria-hidden="true"><i class="sev-fill"></i><span class="sev-run"><i class="sev-knob"></i></span></div>
        ${SEV.map(([k,t,s],i)=>`<button class="sev-o" data-act="rSev" data-v="${k}" aria-pressed="${r.sev===k}"><i class="sev-n" aria-hidden="true"></i><span>${t}<small>${s}</small></span></button>`).join('')}</div>

      <p class="h3 mt24">When did it start?</p><div class="gchips mt12">${WHEN.map((t,i)=>`<button class="gchip" data-act="rWhen" data-v="${i}" aria-pressed="${r.when===i}">${t}</button>`).join('')}</div>

    </div><footer class="st-foot">${pill(r.sev==='fluids'?'Send and call the clinic':'Send to care team','sendReport',{cls:'on-dark',icon:I.send,attrs:ok?'':'aria-disabled="true" data-why="Choose what\'s going on and how much it affects you."'})}</footer>`; },
  flags:(a,p)=>{ p.flags=p.flags||[];
    return `${ph('Urgent signs')}<div class="pscroll"><h2 class="d-l">Is any of this happening now?</h2><p class="serif">Most days, none of these. Tap any that apply.</p>

  /* Clinical alert: the one flat, hard-edged surface in the app. No aura, no glow. */
  urgent:(flags)=>{ const br=flags.includes('allergy'), md=flags.includes('mood');
    return `<div class="alarm"><header class="st-bar"><span class="sp"></span><span class="t"></span><button class="ico al" data-act="popAll" aria-label="Close">${I.x}</button></header><div class="pscroll">

      <p class="al-p">${br?'Swelling or trouble breathing can be a serious allergic reaction.':md?`You don't have to carry this alone.${EM.c?` Call or text ${EM.c}, any time, day or night.`:''}`:'What you described needs a clinician today. Ask them about your next dose before you take it.'}</p>
      <div class="numbox">${br?`<span>Emergency</span><b class="n">${EM.e}</b>`:md&&EM.c?`<span>Crisis line</span><b class="n">${EM.c}</b>`:`<span>Pomegranate clinic, ${CLINIC.hours}</span><b class="n nw">${CLINIC.show}</b><span>Out of hours, or if it's severe: ${EM.e}</span>`}</div>

  /* The closed loop: travelling status dot, honest copy, messages, next step */
  thread:(id,p)=>{ const t=S.threads.find(x=>x.id===id)||activeThread(); if(!t) return `${ph('Messages')}<div class="pscroll"><p class="serif">No conversation yet.</p></div>`; p.tid=t.id;

  compose:(pre,p)=>{ p.c=p.c||{topic:{missed:'Missed dose',vial:'Vial check',needle:'First injection',return:'Back after a break',cost:'Refills and cost',low:'Feeling low'}[pre]||null,text:{missed:'I missed my dose this week. What should I do next?',vial:'My vial looks different from my plan. Can you check it with me?',needle:'I\'m nervous about my first injection. Could someone walk me through it?',return:`I'm back after about ${S.awayDays||10} days away. My last dose was ${lastDose()?fDay(lastDose().d):'a while ago'}. How should I continue?`,cost:'I have a question about my refills and what I\'ll pay.',low:'I\'ve been feeling low lately.'}[pre]||''};

      <label class="sr" for="cText">Your message</label><textarea class="ta mt16" id="cText" placeholder="Write your message" maxlength="800">${esc(p.c.text)}</textarea>
      <p class="serif s mt12">${p.c.topic==='Refills and cost'?'Billing and refill questions go to the same team. Messages are never charged.':`For anything urgent, call the clinic on <span class="nw">${CLINIC.show}</span>.`}</p></div>
      <div class="pfoot">${pill('Send','sendNew',{icon:I.send})}</div>`; },
  history:()=>`${ph('Past conversations')}<div class="pscroll">${S.threads.length?`<div class="rows">${S.threads.slice().reverse().map(t=>`<button class="row" data-act="thread" data-id="${t.id}"><span class="gi">${I.msg}</span><span class="k">${esc(t.topic)}<small>${fDay(iso(new Date(t.at.sent)))} · ${t.closed?'Closed':{sent:'Sent',delivered:'Delivered',replied:'Replied',next:'Next step'}[t.status]}</small></span>${I.chev}</button>`).join('')}</div>`:'<p class="serif">No conversations yet.</p>'}</div>`,
  brief:()=>{ const r=weekRate(), last28=S.doses.filter(d=>diffD(d.d,TODAY)<28), fl=sideFeels(addD(TODAY,-13),TODAY), mv=movesIn(addD(TODAY,-6),TODAY), v=S.visit;
    return `${ph('Visit brief')}<div class="pscroll">${micro(v?`${fLong(v.d)}, ${v.time}`:'Next visit')}<h2 class="d-l">What ${DOC} reads first</h2><p class="serif">So you never have to re-explain.</p>
      <div class="rows mt16">
        <div class="row"><span class="k">Trend</span><span class="v n">${r!=null&&!S.prefs.hideW?`<b>${r>0?'−':'+'}${fW(Math.abs(r))} ${S.unit}</b> a week`:r!=null?'<b>Shared with your team</b>':'Too early'}</span></div>

      <div class="compose mt12"><textarea id="qin" rows="1" placeholder="Add a question" maxlength="160" aria-label="Add a question"></textarea><button class="send" data-act="qAdd" aria-label="Add question">${I.plus}</button></div>
      ${S.briefSent?`<p class="mt16"><span class="chip-s">${I.tick}Delivered to ${DOC}, ${fTime(S.briefSent)}</span></p><p class="serif s mt8">${DOC} reads it before your visit. We'll show "Read" only when she opens it.</p>`:''}
    </div><div class="pfoot">${pill(S.briefSent?'Send updated brief':`Send to ${DOC}`,'sendBrief',{icon:I.send})}</div>`; },
  rx:()=>`${ph('Prescription')}<div class="pscroll">${micro(`From ${DOCFULL}`)}<h2 class="d-l">${S.rx.drug} ${S.rx.mg} mg</h2><p class="serif">Once a week, on ${dayWord()}s.</p>
    <div class="trio light n"><span><b>${S.rx.mg} mg</b> dose</span><span><b>${mL()} mL</b> volume</span><span class="hl"><b>${units()} units</b> on the syringe</span></div>

    <div class="pfoot"><button class="link" data-act="rxWrong">Something looks different</button></div>`,
  plateau:()=>`${ph('Month two')}<div class="pscroll flush">
    <div class="photo-band"><img src="${PH.path}" alt="A walker on a hillside path as mist rolls over the slope" style="object-position:50% 72%"></div>
    <div class="px"><h2 class="d-l">Month two often looks like this.</h2><p class="serif">Early weeks drop faster, partly water. Then the line moves in steps, with flat stretches of a few weeks. A flat stretch is not the medicine stopping, and it isn't you failing.</p>
      <div class="sage-card mt16">${curveSVG()}</div>
      <p class="h3 mt24">What's still changing for you</p>
      <div class="rows mt12"><div class="row"><span class="gi">${I.waist}</span><span class="k">Waist<small>Since day 0</small></span><span class="v n"><b>−${cl(waistDrop()||0).toFixed(1)}</b> ${lenU()}</span></div><div class="row"><span class="gi">${I.move}</span><span class="k">Movement<small>Last 28 days</small></span><span class="v n"><b>${movesIn(addD(TODAY,-27),TODAY).length}</b> sessions</span></div><div class="row"><span class="gi">${I.dose}</span><span class="k">Doses<small>Your record keeps growing</small></span><span class="v n"><b>${S.doses.length}</b></span></div></div>
      <p class="h3 mt24">What tends to help</p><p class="serif mt8">Protein at each meal, some strength work, and sleep. Keep weighing as often as suits you; the 7-day average smooths out the noise.</p>
      <p class="h3 mt24">What your care team does</p><p class="serif mt8">${DOC} looks at your trend at your visit and decides with you whether anything should change. The app never changes your dose.</p></div>
    </div><div class="pfoot">${pill('Add it to my visit brief','addQ',{icon:I.plus,attrs:'data-q="My weight has held steady for three weeks. Is that expected at my dose?"'})}<button class="link" data-act="compose">Message ${RNF}</button></div>`,
  weekone:()=>{ const d=dayN(); const items=[['Day 1','Your first dose. A pinch, then done.'],['Days 2–3','Appetite may drop. Mild nausea is common.'],['Days 4–5','Small meals, protein first, sip water.'],['Days 6–7','How was it? Tell us, good or bad.']];

      <div class="paper mt16">${micro(`From ${RNF}`)}<p class="serif s mt8">Questions are normal this week. I check in on day 3, and you can message me any time.</p></div></div></div>
      <div class="pfoot">${pill(`Message ${RNF}`,'compose',{icon:I.msg})}</div>`; },
  /* Milestone: jade bloom, the number assembling dot by dot */
  milestone:(p0,p)=>{ p.pal='bright'; const m=(p0&&S.ms.find(x=>x.p===+p0))||S.ms.slice().sort((a,b)=>b.p-a.p)[0]||{p:5,d:TODAY}; const lb=S.start.w*m.p/100;
    return `${stTop('',{act:'mileDone'})}<div class="pscroll st-scroll mile">

    </div><footer class="st-foot">${pill('Keep going','mileDone',{cls:'on-dark',icon:I.arrow})}<button class="link-d" data-act="share">Share it without numbers</button></footer>`; },
  share:()=>`${sh('Share')}<div class="pscroll"><div class="sharecard"><img src="${PH.shore}" alt=""><div class="in"><div class="serif big">${weekN()} weeks in.<br><em>Feeling the difference.</em></div><div class="swm">${wmSvg()}</div></div></div>

function render(quiet){

function syncTabs(){ const idx=TABS.findIndex(t=>t[0]===S.tab);

  if(S.onboarded&&S.tab==='today'&&!ret&&firstToday&&!quiet&&!morph){ reveal($('.hl-front',root),260,1500); }

  segs(root); sbar(); reviewMark(); moreAll(); }
/* Tab switch as a shared-element morph: the coloured hero panel travels from one tab's shape and colour to the
   next (FLIP, transform only) while the old content fades out and the new content fades in above it. */
let morphing=null;
function morphTo(t){ const v=$('#view'), old=$(':scope > .screen',v); if(morphing){ morphing(); }
  const oh=old&&$('.hero',old); if(!old||!oh||reduce){ S.tab=t; save(); render(); return; }
  const heroCol=h=>h.classList.contains('mist')?'var(--mist)':'var(--sage)'; const vr=v.getBoundingClientRect(), oR=oh.getBoundingClientRect(), oCol=heroCol(oh);
  S.tab=t; save();
  const tmp=document.createElement('div'); tmp.innerHTML=({today:vToday,progress:vProgress,care:vCare})[t](); const nw=tmp.firstElementChild;
  v.classList.add('morphing'); old.classList.add('m-old'); nw.classList.add('m-new'); v.appendChild(nw); syncTabs();
  const nh=$('.hero',nw), nR=nh.getBoundingClientRect(), nCol=heroCol(nh);
  const mk=(col,op)=>{ const g=document.createElement('i'); g.className='m-ghost'; g.style.cssText=`top:${(nR.top-vr.top).toFixed(1)}px;height:${nR.height.toFixed(1)}px;background:${col};opacity:${op};transform:translate3d(0,${(oR.top-nR.top).toFixed(1)}px,0) scaleY(${(oR.height/nR.height).toFixed(4)})`; v.insertBefore(g,v.firstChild); return g; };
  const g0=mk(oCol,1), g1=mk(nCol,0); afterRender(nw,false,true);
  nw.getBoundingClientRect();
  [g0,g1].forEach(g=>{ g.style.transition='transform .62s var(--spring-soft),opacity .38s ease'; g.style.transform='none'; }); g0.style.opacity=0; g1.style.opacity=1;
  old.classList.add('go'); nw.classList.add('go');
  const done=()=>{ clearTimeout(tm); morphing=null; old.remove(); g0.remove(); g1.remove(); nw.classList.remove('m-new','go'); v.classList.remove('morphing'); moreAll(); };
  const tm=setTimeout(done,680); morphing=done; }
function animLoops(root,anim){ $$('.loop',root).forEach(l=>{ if(!anim||reduce) return; const p=l.style.getPropertyValue('--p'); l.classList.add('still'); l.style.setProperty('--p',0); l.getBoundingClientRect(); l.classList.remove('still'); requestAnimationFrame(()=>l.style.setProperty('--p',p)); }); }
function go(t){ if(S.tab===t){ const sc=$('#view .screen'); sc&&sc.scrollTo({top:0,behavior:reduce?'auto':'smooth'}); return; }
  if(S.onboarded&&!returnMode()) morphTo(t); else { S.tab=t; save(); render(); }
  buzz(6); }

/* onboarding: "What to expect" as a scrubbable vertical timeline */
function mountTimeline(root){ const tl=$('#tl',root); if(!tl) return; const items=$$('.tl-i',tl), rail=$('.tl-rail',tl), needle=$('.tl-needle',tl), fill=$('.tl-fill',tl); let cur=0, drag=false;
  const cy=i=>items[i].offsetTop+18;
  const set=(i,fromDrag)=>{ cur=i; items.forEach((b,j)=>{ b.classList.toggle('on',j===i); b.classList.toggle('past',j<i); b.setAttribute('aria-pressed',j===i); }); if(!fromDrag){ needle.style.transform=`translate3d(0,${cy(i)}px,0)`; } fill.style.transform=`scaleY(${(cy(i)/Math.max(1,rail.offsetHeight)).toFixed(3)})`; setAura($('#view .obwrap'),EXPECT[i][2]); };
  tl._set=set; requestAnimationFrame(()=>set(0));
  tl.addEventListener('pointerdown',e=>{ if(e.button>0) return; drag={y0:e.clientY,moved:false}; });
  tl.addEventListener('pointermove',e=>{ if(!drag) return; if(!drag.moved&&Math.abs(e.clientY-drag.y0)<6) return; if(!drag.moved){ drag.moved=true; tl.setPointerCapture&&tl.setPointerCapture(e.pointerId); tl.classList.add('drag'); }
    const r=tl.getBoundingClientRect(), y=Math.max(cy(0),Math.min(cy(items.length-1),e.clientY-r.top)); needle.style.transform=`translate3d(0,${y}px,0)`;
    let k=0; items.forEach((b,j)=>{ if(Math.abs(cy(j)-y)<Math.abs(cy(k)-y)) k=j; }); if(k!==cur){ set(k,true); buzz(4); } });
  const up=()=>{ if(!drag) return; const d=drag; drag=null; tl.classList.remove('drag'); if(d.moved){ tl._dragged=performance.now(); set(cur); } };
  tl.addEventListener('pointerup',up); tl.addEventListener('pointercancel',up);
  tl.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); const f=items.indexOf(document.activeElement), b0=f>=0?f:cur; const i=Math.max(0,Math.min(items.length-1,b0+(e.key==='ArrowDown'?1:-1))); set(i); items[i].focus(); } }); }

/* ---------- Simulated care-team workflow (clearly a demo; times are realistic, never instant promises) ---------- */
const REPLIES={side:()=>`Thanks for telling us, ${S.name}. Nausea a day or two after a dose is common at this stage, and it usually eases. I've shared your report with ${DOC}.`,
  return:()=>`Welcome back, ${S.name}. Thanks for checking in. I've looked at your log with ${DOC}.`,
  pace:()=>`Thanks for answering, ${S.name}. Losing quickly while eating very little is something we want to help with. I've flagged it for ${DOC}.`,
  def:()=>`Thanks, ${S.name}. I've read this and I'm checking with ${DOC}. I'll come back to you with a clear next step.`};
const NEXTS={side:()=>({title:'Try the nausea plan for three days',body:`Eat smaller meals, stop at the first sign of fullness, and sip fluids through the day. ${DOC} has also sent an anti-nausea prescription to ${PHARM}. It will be ready tomorrow.`,foot:`Keep your current dose. ${DOC} will review it with you at your visit${S.visit?` on ${fDay(S.visit.d)}`:''}. If you can't keep fluids down for a day, call the clinic.`}),
  return:()=>({title:'Carry on with your usual dose day',body:`${DOC} says you can take your next ${S.rx.mg} mg dose on ${DAYS[wd(nextShot())]}, as usual. There's no need to make up the missed week.`,foot:'If nausea feels stronger after the break, tell us. Ana will check in on Friday.'}),
  cost:()=>({title:'Your refill is on its way',body:`Your next refill ships ${fLong(S.rx.refill)}. Your price is the same as last month, and nothing changes without notice.`,foot:''}),
  pace:()=>({title:`A call with ${RNF} this week`,body:'Ana will call you within 2 business days to talk through food and fluids. Until then, aim for small, regular meals with protein.',foot:'If you feel faint or confused, call 911.'}),
  def:()=>({title:'Talk it through at your visit',body:`${DOC} has added your question to your visit${S.visit?` on ${fDay(S.visit.d)}`:''}. Nothing to change before then.`,foot:''})};
function newThread(kind,topic,first){ S.threads.forEach(t=>{ if(!t.closed&&(t.status==='next'||t.status==='replied')) t.closed=true; });
  const now=Date.now(); const t={id:'t'+now,kind,topic,status:'sent',at:{sent:now},msgs:[first],unread:false,closed:false}; S.threads.push(t); save(); return t; }
function scheduleDelivered(t){ setTimeout(()=>{ if(t.status!=='sent') return; t.status='delivered'; t.at.delivered=Date.now(); save(); refreshThread(t,0); },reduce?400:1800); }
function refreshThread(t,prev){ const p=topP(); if(p&&p.name==='thread'&&p.tid===t.id){ p.prevIdx=prev; p.keep=true; paint(p); }
  else { if(!stack.length) render(true); const tp=topP(); if(tp&&['urgent','support','milestone'].includes(tp.name)) return; toast(t.status==='delivered'?'Your message reached your care team. Not read yet.':t.status==='replied'?`${RNF} replied.`:'Your next step is ready.'); } }
function advanceThread(){ const t=activeThread()||S.threads[S.threads.length-1]; if(!t){ toast('Send a message or a report first.'); return; }
  const i=STATUSES.indexOf(t.status); if(i>=3){ toast('This conversation is already at its next step.'); return; } const now=Date.now(), k=STATUSES[i+1];
  t.status=k; t.at[k]=now;
  if(k==='replied'){ t.msgs.push({f:'them',who:RN,t:(REPLIES[t.kind]||REPLIES.def)(),ts:now}); t.unread=true; }
  if(k==='next'){ t.step=(NEXTS[t.kind]||NEXTS.def)(); t.unread=true; }
  save(); refreshThread(t,i); }

      onSettle:v=>{ p.v=v; dmSet($('#readout .dm',el),v.toFixed(1),{label:`${v.toFixed(1)} ${p.u}`}); } }); },
  dose:(el,p)=>{ if(p.sealed) return; HoldRing($('#hold',el),{ms:1150,onDone:()=>A.sealDone()}); },
  move:(el,p)=>{ const R=$('#mruler',el); p.ruler=Ruler(R,{min:5,max:180,step:5,pps:15,major:15,mid:5,value:p.m.min,label:'Workout length in minutes. Drag, or use the arrow keys.',fmt:n=>String(n),text:v=>`${Math.round(v)} minutes`,

  thread:(el,p)=>{ const t=S.threads.find(x=>x.id===p.tid); if(!t) return; if(t.unread){ t.unread=false; save(); if(p.prevIdx==null&&STATUSES.indexOf(t.status)>=2){ const sc=$('#tscroll',el); setTimeout(()=>sc&&sc.scrollTo({top:sc.scrollHeight,behavior:reduce?'auto':'smooth'}),700); } }
    const vl=$('.vloop',el), idx=STATUSES.indexOf(t.status); const from=p.prevIdx!=null?p.prevIdx:(p.mounted?null:0); p.mounted=true;
    if(vl&&from!=null&&from!==idx&&!reduce){ const rows=$$('.vl-row',vl); rows.forEach((r,i)=>{ if(i>from){ r.classList.remove('done','now'); } }); vl.classList.add('still'); vl.style.setProperty('--p',from); vl.getBoundingClientRect(); vl.classList.remove('still');
      requestAnimationFrame(()=>{ vl.style.setProperty('--p',idx); }); const step=Math.max(1,idx-from);
      for(let i=from+1;i<=idx;i++) setTimeout(()=>{ rows[i]&&rows[i].classList.add('done'); if(i===idx){ rows[i]&&rows[i].classList.add('now'); buzz(8); } },180+ (i-from)/step*620);
      if(idx>=2&&p.prevIdx!=null){ const sc=$('#tscroll',el); setTimeout(()=>sc&&sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'}),500); } }
    p.prevIdx=null; },
  milestone:(el,p)=>{ dmAssemble($('.mile-num .dm',el),820); setTimeout(()=>bloom(el),120); buzz([10,50,10]); },
  report:(el,p)=>{ const t=$('#rNote',el); t&&t.addEventListener('input',()=>{ p.r.note=t.value; });
    const sev=$('#sev',el); requestAnimationFrame(()=>placeKnob(sev,SEV.findIndex(s=>s[0]===p.r.sev)));
    /* drag the knob along the severity ruler; it snaps to the nearest level */
    let d=null; const os=$$('.sev-o',sev), cy=i=>os[i].offsetTop+os[i].offsetHeight/2;
    sev.addEventListener('pointerdown',e=>{ if(e.button>0) return; d={y0:e.clientY,moved:false}; });
    sev.addEventListener('pointermove',e=>{ if(!d) return; if(!d.moved&&Math.abs(e.clientY-d.y0)<7) return; if(!d.moved){ d.moved=true; sev.setPointerCapture&&sev.setPointerCapture(e.pointerId); sev.classList.add('drag'); sev.dataset.set='true'; }
      const r=sev.getBoundingClientRect(), y=Math.max(cy(0),Math.min(cy(os.length-1),e.clientY-r.top)); $('.sev-run',sev).style.transform=`translate3d(0,${y.toFixed(1)}px,0)`; $('.sev-fill',sev).style.transform=`scaleY(${(y/sev.offsetHeight).toFixed(3)})`;

/* ---------- Demo seeds (only for the reviewer states) ---------- */
function seed(n,opt={}){
  S=blank(); const start=addD(TODAY,-n); let r=11; const rnd=()=>{ r=(r*16807)%2147483647; return r/2147483647; };
  Object.assign(S,{onboarded:true,ob:4,tab:'today'}); S.prefs.lock=false;
  S.start={d:start,w:231.4,waist:44.5,photo:null};
  S.rx={drug:'Tirzepatide',mg:n>28?5:2.5,conc:n>28?10:5,days:[wd(start)],lot:n>28?'L2409-17':'L2408-03',bud:addD(TODAY,38),left:3,refill:addD(TODAY,4)};
  const base=i=>{ const ii=opt.plateau?Math.min(i,39):i; return 231.4*(1-0.0068*ii/7)-(ii>3?1.6:ii*.4); };
  for(let i=0;i<n;i++){ const d=addD(start,i);
    if(i===0||rnd()<.72) S.weights.push({d,v:+(base(i)+(rnd()-.5)*(opt.plateau&&i>39?1.4:2.2)).toFixed(1),ts:at(d,7,10)});
    if(i%7===0){ const mg=i<28?2.5:5, conc=i<28?5:10; S.doses.push({d,ts:at(d,8,30),mg,conc,units:Math.round(mg/conc*100),site:SITES[(i/7+3)%6]}); }
    if(i%14===0) S.waists.push({d,v:+(44.5-i/7*.26).toFixed(1),ts:at(d,7,20)});
    S.protein[d]=[30,20,30,rnd()<.6?20:0].filter(Boolean);
    if(rnd()<.5) S.moves.push({d,ts:at(d,18),type:rnd()<.55?'walk':'strength',min:[20,30,30,45][Math.floor(rnd()*4)]});
    if(i%3===0&&i<n-1) S.feels.push({d,ts:at(d,20),sx:i<12?['nausea']:[],sev:i<12?'little':null});
  }
  S.weights[0].v=231.4;
  S.notes=[{d:start,ts:at(start,10),who:DOCFULL,t:'Start Tirzepatide 2.5 mg once a week for 4 weeks.'}];
  if(n>28) S.notes.push({d:addD(start,27),ts:at(addD(start,27),10),who:DOCFULL,t:'Go up to 5 mg. New vial is 10 mg/mL, so you still draw to 50 units.'});
  if(n>52) S.labs=[{d:addD(start,52),name:'A1c',v:'5.7%',note:`Back in the normal range. ${DOC}`}];
  S.visit={d:addD(TODAY,3),time:'10:30 am'}; S.qs=['Should I still feel full this fast at 5 mg?'];
  S.threads=[{id:'t0',kind:'hello',topic:'Welcome from Ana',status:'replied',at:{sent:at(start,9),delivered:at(start,9,1),replied:at(start,10)},msgs:[{f:'them',who:RN,t:`Hi ${S.name}, I'm Ana, your nurse on ${DOC}'s team. Message me any time. You'll always see when I've replied.`,ts:at(start,10)}],unread:false,closed:true}];
  if(n>24){ const d=addD(start,22); S.threads.push({id:'t1',kind:'def',topic:'Itchy injection spot',status:'next',at:{sent:at(d,19,12),delivered:at(d,19,13),replied:at(addD(d,1),9,40),next:at(addD(d,1),9,45)},msgs:[{f:'me',t:'The spot on my belly is red and a bit itchy after last night.',ts:at(d,19,12)},{f:'them',who:RN,t:'Thanks for the photo-free description, Denise. Mild redness is common and should fade in a day or two.',ts:at(addD(d,1),9,40)}],step:{title:'Rotate spots and use a cool compress',body:'Use a different spot each week. A cool compress helps. Tell us if it spreads or feels hot.',foot:'',done:true,brief:false},unread:false,closed:true}); }
  const ser=avgSeries(); [5,10].forEach(p=>{ const hit=ser.find(x=>(231.4-x.v)/231.4*100>=p); if(hit) S.ms.push({p,d:hit.d}); });
  S.lastOpen=TODAY;
}
function addDose(d,h,m){ S.doses.push({d,ts:at(d,h,m),mg:S.rx.mg,conc:S.rx.conc,units:units(),site:SITES[nextSite()]}); S.rx.left=Math.max(0,S.rx.left-1); }
function trimAfter(cut){ const keep=x=>x.d<=cut; S.weights=S.weights.filter(keep); S.doses=S.doses.filter(keep); S.feels=S.feels.filter(keep); S.moves=S.moves.filter(keep); Object.keys(S.protein).forEach(d=>{ if(d>cut) delete S.protein[d]; }); }
function seedThread(k){ const idx=STATUSES.indexOf(k==='nextstep'?'next':k);
  const t={id:'t9',kind:'side',topic:'Nausea',status:STATUSES[idx],at:{sent:at(TODAY,9,41)},msgs:[{f:'me',rep:{sx:['nausea'],sev:'lot',when:1,note:'Hard to eat dinner the last two nights.'},ts:at(TODAY,9,41)}],unread:false,closed:false};
  if(idx>=1) t.at.delivered=at(TODAY,9,42);
  if(idx>=2){ t.at.replied=at(TODAY,13,58); t.msgs.push({f:'them',who:RN,t:REPLIES.side(),ts:t.at.replied}); t.unread=true; }
  if(idx>=3){ t.at.next=at(TODAY,14,5); t.step=NEXTS.side(); }
  S.threads.push(t); S.feels.push({d:TODAY,ts:at(TODAY,9,41),sx:['nausea'],sev:'lot'}); }
const DEMO=[['first','First open','Onboarding, value before account'],['dose','Today, dose day','One clear next step'],['done','Today, dose done','Sealed, with undo'],['weekone','Week one','First-week companion'],['late','Missed reminder','Neutral, never red'],['milestone','Milestone','5% of starting weight'],['return','Back after 10 days','Welcome, no backlog'],['report','Side-effect report','Tactile, urgent route'],['sent','Message sent','Loop step 1'],['delivered','Delivered to care team','Loop step 2, not read yet'],['replied','Nurse replied','Loop step 3'],['nextstep','Next step','Loop closed by the clinician'],['plateau','Plateau, month two','Expectations reframe'],['alert','Clinical alert','Reserved styling'],['progress','Progress tab','Trend, record, editorial rows'],['care','Care tab','Team, support, urgent route']];
let curState=null;
function applyState(k){
  clearStack(); $('#lock').classList.remove('on'); $('#loader').classList.remove('on'); chartMode='weight'; curState=k;
  if(k==='first'){ S=blank(); S.demo='first'; firstToday=true; $('#view').innerHTML=''; render(); try{ history.replaceState(null,'','#'+k); }catch(e){} return; }
  const n={milestone:45,return:62,late:65,plateau:60,weekone:3}[k]; seed(n==null?63:n,{plateau:k==='plateau'}); S.demo=k;
  if(['done','report','sent','delivered','replied','nextstep'].includes(k)) addDose(TODAY,8,14);
  if(k==='return'){ trimAfter(addD(TODAY,-10)); S.awayDays=10; S.lastOpen=addD(TODAY,-10); }
  if(k==='weekone'){ S.weights.push({d:TODAY,v:229.6,ts:at(TODAY,7,5)}); }
  if(k==='late'){ S.doses=S.doses.filter(x=>diffD(x.d,TODAY)>3); S.rx.left=3; }
  if(k==='milestone'){ S.weights=S.weights.filter(w=>diffD(w.d,TODAY)>=7); for(let i=6;i>=0;i--) S.weights.push({d:addD(TODAY,-i),v:+(231.4*0.949+[.3,-.2,.1,-.3,.2,-.1,0][i]).toFixed(1),ts:at(addD(TODAY,-i),7,5)}); S.ms=S.ms.filter(m=>m.p!==5); S.ms.push({p:5,d:TODAY}); }
  if(['sent','delivered','replied','nextstep'].includes(k)) seedThread(k);
  if(k==='alert'){ S.alert={kind:'gall',short:'the pain you reported',t:'Pain under the right ribs with fever',ts:at(TODAY,7,52)}; S.threads.push({id:'t8',kind:'urgent',topic:'Urgent signs reported',status:'delivered',at:{sent:at(TODAY,7,52),delivered:at(TODAY,7,53)},msgs:[{f:'sys',t:'Urgent signs reported: pain under the right ribs with fever. You were asked to call the clinic.',ts:at(TODAY,7,52)}],unread:false,closed:false}); }
  if(k==='progress') S.tab='progress'; if(k==='care') S.tab='care';
  firstToday=true; render();
  if(k==='milestone') push('milestone',5);
  if(k==='report') push('report');
  if(['sent','delivered','replied','nextstep'].includes(k)) push('thread','t9');
  try{ history.replaceState(null,'','#'+k); }catch(e){}
}

/* ---------- Reviewer panel (desktop only, outside the phone) ---------- */
function buildReview(){ const r=$('#review'); if(!r) return;
  r.innerHTML=`<div class="rv-k">Prototype · reviewer panel</div><h2>Pomegranate</h2><p>Not part of the app. Jump to any state. On a phone, press and hold the wordmark.</p>
    <div class="rv-list">${DEMO.map(([k,t,s],i)=>`<button data-rv="${k}"><b>${pad2(i+1)}</b><span>${t}<br><small>${s}</small></span></button>`).join('')}</div>
    <div class="rv-act"><button data-rv-act="advance">Advance message status</button><button data-rv-act="restart">Reset to first open</button></div>`;
  r.addEventListener('click',e=>{ const b=e.target.closest('[data-rv]'); if(b){ applyState(b.dataset.rv); return; } const c=e.target.closest('[data-rv-act]'); if(c){ c.dataset.rvAct==='advance'?advanceThread():(A.restart(),curState='first',reviewMark()); } }); }
function reviewMark(){ $$('#review [data-rv]').forEach(b=>b.setAttribute('aria-current',b.dataset.rv===curState)); }

/* ---------- Gestures ---------- */
try{ history.replaceState(history.state||{pg:0},''); history.pushState({pg:1},''); }catch(e){}
addEventListener('popstate',()=>{ try{ history.pushState({pg:1},''); }catch(e){} goBack(); });
$('#scrim').addEventListener('click',()=>{ if(topP()&&topP().sheet) pop(); });
(function edgeSwipe(){ const host=$('#app'); let d=null;
  host.addEventListener('pointerdown',e=>{ const p=topP(); if(!p||p.sheet) return; const r=host.getBoundingClientRect(); if(e.clientX-r.left>24) return; d={el:p.el,x:e.clientX,lx:e.clientX,t:performance.now(),v:0,w:r.width,on:false}; },true);
  host.addEventListener('pointermove',e=>{ if(!d) return; const dx=Math.max(0,e.clientX-d.x); if(!d.on){ if(dx<10) return; d.on=true; d.el.classList.add('drag'); } const now=performance.now(); d.v=(e.clientX-d.lx)/Math.max(1,now-d.t)*1000; d.t=now; d.lx=e.clientX; d.el.style.transform=`translate3d(${dx}px,0,0)`; },true);
  const end=()=>{ if(!d) return; const w=d; d=null; if(!w.on) return; const dx=parseFloat(w.el.style.transform.slice(12))||0; w.el.classList.remove('drag'); w.el.style.transform=''; if(dx>w.w*.35||w.v>650) pop(); };
  host.addEventListener('pointerup',end,true); host.addEventListener('pointercancel',end,true); })();
(function sheetDrag(){ let d=null;
  document.addEventListener('pointerdown',e=>{ const p=topP(); if(!p||!p.sheet) return; const r=p.el.getBoundingClientRect(); if(e.clientY-r.top>44||e.clientY<r.top) return; d={el:p.el,y:e.clientY,ly:e.clientY,t:performance.now(),v:0,on:false}; });
  document.addEventListener('pointermove',e=>{ if(!d) return; const dy=Math.max(0,e.clientY-d.y); if(!d.on){ if(dy<8) return; d.on=true; d.el.classList.add('drag'); } const now=performance.now(); d.v=(e.clientY-d.ly)/Math.max(1,now-d.t)*1000; d.t=now; d.ly=e.clientY; d.el.style.transform=`translate3d(0,${dy}px,0)`; });
  document.addEventListener('pointerup',e=>{ if(!d) return; const w=d; d=null; if(!w.on) return; const dy=Math.max(0,e.clientY-w.y); w.el.classList.remove('drag'); w.el.style.transform=''; if(dy>110||w.v>700) pop(); }); })();
/* Long-press the wordmark for the reviewer menu (kept out of the patient-facing hierarchy) */
(function holdDemo(){ let t=null, sx=0, sy=0;
  document.addEventListener('pointerdown',e=>{ const w=e.target.closest('[data-hold-demo]'); if(!w) return; sx=e.clientX; sy=e.clientY; clearTimeout(t); t=setTimeout(()=>{ t=null; buzz(20); clearStack(); push('demo',null,{sheet:true}); },650); });
  const cancel=()=>{ clearTimeout(t); t=null; };
  document.addEventListener('pointerup',cancel); document.addEventListener('pointercancel',cancel);
  document.addEventListener('pointermove',e=>{ if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>12) cancel(); });
  document.addEventListener('contextmenu',e=>{ if(e.target.closest('[data-hold-demo]')) e.preventDefault(); }); })();

document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){ clearStack(); go(tb.dataset.tab); return; }
  const a=e.target.closest('[data-act]'); if(!a||a.tagName==='INPUT') return;
  if(stack.length&&!topP().el.contains(a)&&!a.closest('#toast')) return;
  const f=A[a.dataset.act]; if(f){ if(a.tagName!=='A') e.preventDefault(); f(a); }
});
document.addEventListener('change',async e=>{
  const i=e.target; if(i.type!=='file'||!i.files[0]) return;
  let img; try{ img=await readImg(i.files[0]); }catch(_){ toast('Couldn\'t read that photo. Try another.'); return; }
  if(i.dataset.act==='photoPick'){ const p=topP(); p.img=img; paint(p); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&stack.length){ pop(); return; }
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='qin'){ e.preventDefault(); A.qAdd(); }
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cin'){ e.preventDefault(); A.send(); }
});
addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(DEMO.some(d=>d[0]===k)&&k!==curState) applyState(k); else if(k==='states'){ clearStack(); push('demo',null,{sheet:true}); } });
function readImg(file,max=900){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k)); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.78)); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

/* ---------- Scroll affordance: a soft fade at the lower edge whenever more content waits below ---------- */
function updMore(sc){ if(!sc||!sc.classList) return; sc.classList.toggle('more',sc.scrollTop+sc.clientHeight<sc.scrollHeight-6); }
function moreAll(){ requestAnimationFrame(()=>$$('.pscroll').forEach(updMore)); }
document.addEventListener('scroll',e=>{ if(e.target.classList&&e.target.classList.contains('pscroll')) updMore(e.target); },true);
addEventListener('resize',moreAll);
/* ---------- Guards: clipped containers never scroll (focus or scrollIntoView could shift the whole app) ---------- */
addEventListener('scroll',()=>{ if(scrollX||scrollY) scrollTo(0,0); });
['#stage','#app','#view','#pages'].forEach(s=>{ const e=$(s); e&&e.addEventListener('scroll',()=>{ if(e.scrollTop||e.scrollLeft){ e.scrollTop=0; e.scrollLeft=0; } }); });
/* ---------- Grain tile, launch and lock ---------- */
(function grain(){ try{ const c=document.createElement('canvas'); c.width=c.height=120; const x=c.getContext('2d'), d=x.createImageData(120,120); for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=Math.random()<.5?22:0; } x.putImageData(d,0,0); document.documentElement.style.setProperty('--grain',`url(${c.toDataURL()})`); }catch(e){} })();
function runLoader(next){ const L=$('#loader'); if(reduce){ next(); return; }
  L.innerHTML=auraHTML('brand')+`<div class="ld-wm">${wmSvg()}</div>`; L.classList.add('on'); L.classList.remove('out'); sbar();
  let done=false; const fin=()=>{ if(done) return; done=true; next(); L.classList.add('out'); setTimeout(()=>{ L.classList.remove('on','out'); L.innerHTML=''; sbar(); },620); };
  L.onclick=fin; setTimeout(fin,1300); }
function lock(){ const l=$('#lock'); l.innerHTML=`${auraHTML('calm')}<div class="lk"><div class="lk-wm">${wmSvg()}</div><p class="serif">Locked. Only you can open your record.</p>${pill('Unlock with Face ID','unlock',{cls:'on-dark',icon:I.lock})}<button class="link-d" data-act="unlock">Use passcode</button></div>`; l.classList.add('on'); sbar(); }

/* ---------- Boot ---------- */
buildTabs(); buildReview();
load();
if(S.onboarded){ const gap=diffD(S.lastOpen||TODAY,TODAY); if(gap>=7) S.awayDays=gap; S.lastOpen=TODAY; save(); }
const st0=(location.hash||'').slice(1)||Q.get('state')||'';
if(DEMO.some(d=>d[0]===st0)) applyState(st0);
else { render(); runLoader(()=>{ if(S.onboarded&&S.prefs.lock) lock(); }); if(st0==='states') push('demo',null,{sheet:true}); }
